# LeadKart Go — Taskfile (taskfile.dev)
#
# Install: https://taskfile.dev/installation/
# Run: `task <name>` from repo root.
# List all tasks: `task` (no args) or `task --list-all`.
#
# 2026 Go canon: Taskfile preferred over Makefile (cross-platform, structured).
# Per the master plan §Phase 4 + JetBrains 2025 Go Ecosystem report.
#
# Doctrine: Taskfile is a CONVENIENCE WRAPPER, not a replacement for the
# underlying tools. Each task delegates to the canon tool (go test, goose,
# docker buildx, gh, govulncheck) — the wrapper just remembers the long
# flag combinations so humans don't have to.

version: '3'

vars:
  COVER_OUT: coverage.out
  COVER_INT_OUT: coverage-integration.out
  BIN_DIR: bin
  GO_LINT_VERSION: v2.12.2
  # Migration runner connection — override per env: `DATABASE_URL=... task migrate:up`
  DATABASE_URL: '{{.DATABASE_URL | default "postgres://leadkart:leadkart_dev@localhost:5432/leadkart?sslmode=disable"}}'
  MIGRATIONS_DIR: migrations
  # Compose path used for dev stack tasks
  COMPOSE_FILE: docker/compose.yml

tasks:
  default:
    desc: Show task list
    cmds:
      - task --list

  # =====================================================================
  # Build + run
  # =====================================================================

  build:
    desc: Build all binaries (api / migrate) into bin/
    cmds:
      - go build -trimpath -ldflags="-s -w" -o {{.BIN_DIR}}/ ./cmd/...

  run:
    desc: Run API locally with hot reload (requires `air`)
    cmds:
      - air

  clean:
    desc: Remove build artifacts + coverage + tmp
    cmds:
      - rm -rf {{.BIN_DIR}} tmp coverage.out coverage-integration.out coverage.html dist junit-*.xml

  # =====================================================================
  # Tests — `go test` is canon. Wrappers below remember the flag combos.
  # =====================================================================

  test:
    desc: Unit tests with shuffle (excludes architecture tests — see test:arch)
    cmds:
      - go test -shuffle=on -skip "^TestArch_" -coverprofile={{.COVER_OUT}} ./...

  test:race:
    desc: Unit tests with race detector (requires CGO_ENABLED=1 + gcc)
    cmds:
      - CGO_ENABLED=1 go test -race -shuffle=on -skip "^TestArch_" ./...

  test:arch:
    desc: Architecture tests (TestArch_* — integration-events hygiene + marker rules)
    cmds:
      - go test -shuffle=on -run "^TestArch_" ./internal/identity/integrationevents/...

  test:int:
    desc: Integration tests (testcontainers Postgres; requires Docker)
    cmds:
      - go test -shuffle=on -tags=integration -timeout=15m -coverprofile={{.COVER_INT_OUT}} ./...

  test:smoke:
    desc: Container-level smoke against running compose stack (requires `docker:up:full`)
    cmds:
      - bash scripts/smoke.sh

  test:all:
    desc: Run unit + arch + integration sequentially (matches CI's go-only chain)
    cmds:
      - task: test:race
      - task: test:arch
      - task: test:int

  cover:
    desc: HTML coverage report (depends on test)
    deps: [test]
    cmds:
      - go tool cover -html={{.COVER_OUT}} -o coverage.html

  # =====================================================================
  # Code quality
  # =====================================================================

  lint:
    desc: Run golangci-lint v2 strict profile (5-minute timeout — matches CI)
    cmds:
      - golangci-lint run --timeout=5m

  fmt:
    desc: Format all Go files (gofmt)
    cmds:
      - gofmt -w .

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  vuln:
    desc: Scan for known vulnerabilities (govulncheck pinned via go.mod tool directive)
    cmds:
      - go tool govulncheck ./...

  tidy:
    desc: go mod tidy + verify
    cmds:
      - go mod tidy
      - go mod verify

  generate:
    desc: Run all codegen (sqlc, mocks, oapi when wired)
    cmds:
      - go generate ./...

  ci:
    desc: Fast pre-push gate (vet + lint + test + arch + vuln + build). No CGO/Docker needed.
    cmds:
      - task: vet
      - task: lint
      - task: test
      - task: test:arch
      - task: vuln
      - task: build

  ci:race:
    desc: CI's race-detector pass (matches the GH Actions unit job exactly). Requires CGO + gcc.
    cmds:
      - task: vet
      - task: lint
      - task: test:race
      - task: test:arch
      - task: vuln
      - task: build

  ci:full:
    desc: Full GH Actions pipeline mirror (race + integration + smoke). Requires CGO + Docker.
    cmds:
      - task: ci:race
      - task: test:int
      - task: ci:smoke

  ci:smoke:
    desc: 'Mints ephemeral JWT key + runs full compose smoke (matches GH Actions container-smoke job).'
    cmds:
      - mkdir -p docker
      - |
        cat > docker/.env <<EOF
        LEADKART_JWT__KEY_ID=local-smoke-$(date +%s)
        LEADKART_JWT__SIGNING_KEY=$(openssl rand -hex 32)
        EOF
      - defer: docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full down -v
      - defer: rm -f docker/.env
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full up -d --build
      # Probe the admin /ready endpoint instead of `docker inspect` so we
      # avoid escaping Go template braces inside Taskfile's own template.
      # Same readiness signal the container's HEALTHCHECK uses.
      - |
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:9090/ready >/dev/null 2>&1; then
            echo "api ready after ${i} attempts"
            break
          fi
          sleep 2
        done
      - bash scripts/smoke.sh

  # =====================================================================
  # Migrations — wraps goose (the canon migration tool, ADR 0005)
  # =====================================================================

  migrate:status:
    desc: Show pending vs applied migrations
    cmds:
      - go run ./cmd/migrate status
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      MIGRATIONS_DIR: '{{.MIGRATIONS_DIR}}'

  migrate:up:
    desc: Apply all pending migrations (DATABASE_URL overridable)
    cmds:
      - go run ./cmd/migrate up
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      MIGRATIONS_DIR: '{{.MIGRATIONS_DIR}}'

  bootstrap:
    desc: 'Provision platform tenant + SuperAdmin (idempotent; reads LEADKART_SUPERADMIN__* env).'
    cmds:
      - go run ./cmd/bootstrap
    env:
      LEADKART_POSTGRES__DSN: '{{.DATABASE_URL}}'

  bootstrap:status:
    desc: 'Report bootstrap state (read-only — does not write).'
    cmds:
      - go run ./cmd/bootstrap --status
    env:
      LEADKART_POSTGRES__DSN: '{{.DATABASE_URL}}'

  migrate:down:
    desc: Roll back the most recent migration
    cmds:
      - go run ./cmd/migrate down
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      MIGRATIONS_DIR: '{{.MIGRATIONS_DIR}}'

  migrate:redo:
    desc: Roll back + re-apply the most recent migration (round-trip check)
    cmds:
      - go run ./cmd/migrate redo
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      MIGRATIONS_DIR: '{{.MIGRATIONS_DIR}}'

  migrate:version:
    desc: Print the currently-applied migration version
    cmds:
      - go run ./cmd/migrate version
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      MIGRATIONS_DIR: '{{.MIGRATIONS_DIR}}'

  migrate:validate:
    desc: Parse-check every migration file without applying
    cmds:
      - go run ./cmd/migrate validate
    env:
      DATABASE_URL: '{{.DATABASE_URL}}'
      MIGRATIONS_DIR: '{{.MIGRATIONS_DIR}}'

  migrate:new:
    desc: 'Create a new SQL migration: task migrate:new -- <name>'
    cmds:
      - 'goose -dir {{.MIGRATIONS_DIR}} create {{.CLI_ARGS}} sql'
    preconditions:
      - sh: command -v goose
        msg: 'goose CLI required. Install: go install github.com/pressly/goose/v3/cmd/goose@latest'

  # =====================================================================
  # Dev workflow — fast inner loop. `task dev` is the canonical
  # "I'm coding now" command. Pre-push hook acts as the local gate
  # before code leaves your machine; GitHub Actions remains the backstop.
  # =====================================================================

  dev:
    desc: Start full dev stack + tail api logs (the canonical "I'm coding now" command)
    cmds:
      - task: docker:up:full
      - task: docker:logs

  hooks:install:
    desc: Activate the tracked git hooks under scripts/githooks (one-time per clone)
    cmds:
      - git config core.hooksPath scripts/githooks
      - 'echo "git hooks active. pre-push will run task ci before every push."'
      - 'echo "uninstall with: task hooks:uninstall. one-shot bypass with: git push --no-verify"'

  hooks:uninstall:
    desc: Stop running tracked git hooks (reverts core.hooksPath to default)
    cmds:
      - git config --unset core.hooksPath
      - 'echo "git hooks deactivated. push will no longer run local CI."'

  # =====================================================================
  # Docker (dev stack via compose --profile full)
  # =====================================================================

  docker:env:
    desc: 'Mint docker/.env via scripts/devenv (idempotent — skips if file exists with a non-empty JWT key).'
    # Skip-condition: file present AND JWT signing key line has a
    # non-empty value. Catches the prior bash-heredoc failure mode
    # where openssl wasn't in PATH + the file ended up with empty
    # KEY=VALUE lines that compose treats as "unset".
    status:
      - test -f docker/.env
      - 'grep -q ''^LEADKART_JWT__SIGNING_KEY=..*'' docker/.env'
    cmds:
      - mkdir -p docker
      - go run ./scripts/devenv > docker/.env
      - 'echo ""'
      - 'echo "  wrote docker/.env"'
      - 'echo "  superadmin email:    superadmin@leadkart.local"'
      - 'echo "  superadmin password: LeadKart!Dev2026"'
      - 'echo ""'

  docker:env:reset:
    desc: 'Force-regenerate docker/.env (use when JWT key got corrupted or you want a fresh signing key).'
    cmds:
      - rm -f docker/.env
      - task: docker:env

  docker:build:
    desc: Build api + migrate images locally via docker buildx
    deps: [docker:env]
    cmds:
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full build

  docker:up:
    desc: Start postgres + redis only (host-side `air` workflow)
    deps: [docker:env]
    cmds:
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} up -d

  docker:up:full:
    desc: Start full stack (postgres + redis + migrate + api built locally)
    deps: [docker:env]
    cmds:
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full up -d --build

  docker:down:
    desc: Stop and remove all containers (preserves volumes)
    cmds:
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full down

  docker:wipe:
    desc: Stop + remove containers AND volumes (full reset)
    cmds:
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full down -v

  docker:logs:
    desc: 'Tail logs from a service: task docker:logs -- api  (default: api)'
    cmds:
      - 'docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full logs -f --tail=200 {{.CLI_ARGS | default "api"}}'

  docker:ps:
    desc: Show stack status
    cmds:
      - docker compose --env-file docker/.env -f {{.COMPOSE_FILE}} --profile full ps

  # =====================================================================
  # Release (canon: GitHub Actions builds + signs; this just tags)
  # =====================================================================

  release:tag:
    desc: 'Tag a release: task release:tag -- v0.2.2  (triggers release.yml)'
    cmds:
      - 'git tag -a {{.CLI_ARGS}} -m "Release {{.CLI_ARGS}}"'
      - 'git push origin {{.CLI_ARGS}}'
    preconditions:
      - sh: '[[ -n "{{.CLI_ARGS}}" ]]'
        msg: 'tag argument required: task release:tag -- v0.2.2'
      - sh: 'git diff --quiet && git diff --cached --quiet'
        msg: 'working tree must be clean before tagging'
