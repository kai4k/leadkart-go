name: CI

# ============================================================================
# LeadKart Go — CI orchestrator.
#
# FAANG-style layout (hashicorp / aws-samples / google-github-actions
# canon):
#
#   .github/
#     workflows/
#       ci.yml              # THIS FILE — the orchestrator. Per-PR triggers,
#                           # path-aware gating, fans out to reusable workflows.
#       _go-test.yml        # Reusable Go test runner (used by unit, arch, int).
#       _lint.yml           # Reusable lint + vet + vuln + build.
#       _docker.yml         # Reusable docker build + smoke chain.
#       _openapi.yml        # Reusable OpenAPI Spectral lint.
#       _migrations.yml     # Reusable migrations apply-cleanly check.
#     actions/
#       go-setup/           # Composite — checkout + Go + Task install.
#       junit-report/       # Composite — JUnit upload + PR Checks annotate.
#
# The `_` prefix on reusable workflows is community convention (hashicorp,
# snyk, aws-samples) — flags "called only, not directly triggered."
#
# JOB GRAPH (maximum-parallelism shape):
#
#   changes ─┬─ lint
#            ├─ unit
#            ├─ architecture
#            ├─ integration (matrix × 7 shards in parallel)
#            ├─ openapi-lint
#            ├─ migrations-check
#            └─ docker (build → smoke)
#
# CRITICAL PATH: ~5-6 min (heaviest single job) vs old ~17 min serialized.
# All Go test jobs run in parallel after `changes` — they share NO state,
# each runner does its own checkout + go-setup. A compile failure surfaces
# in every job simultaneously (~10s into each) instead of blocking the
# downstream chain.
#
# PATH-AWARE GATING: `changes` runs dorny/paths-filter once + emits per-
# area outputs; jobs gate against `needs.changes.outputs.<area>` so a
# pure-docs PR (paths-ignore filter above) doesn't even spin runners,
# and a Go-only PR skips docker-build + smoke.
#
# COMMAND CANON: every test invocation goes through `task <name>` — the
# Taskfile owns the package list / flags / pinned tool versions.
# Drift-prevention: fitness functions in
# internal/architecture/ci_arch_coverage_test.go assert each job calls
# its task by name + rejects inline `go test` / `gotestsum` / `npx`.
# ============================================================================

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
      - '.gitignore'

# Cancel in-progress runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Top-level default-restrictive permissions per GitHub's security-
# hardening guide. Reusable workflows declare their own permissions
# block (least-privilege per concern).
permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # changes — dorny/paths-filter probe (~10s). Outputs feed every other
  # job's `if:` condition for path-aware gating.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.filter.outputs.go }}
      docker: ${{ steps.filter.outputs.docker }}
      migrations: ${{ steps.filter.outputs.migrations }}
      openapi: ${{ steps.filter.outputs.openapi }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            go:
              - '**.go'
              - 'go.mod'
              - 'go.sum'
              - 'migrations/**'
              - 'internal/identity/adapters/sql/**'
              - 'sqlc.yaml'
              - '.golangci.yml'
              - 'Taskfile.yml'
              - '.github/workflows/**'
              - '.github/actions/**'
            migrations:
              - 'migrations/**'
              - 'cmd/migrate/**'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            docker:
              - 'docker/**'
              - 'scripts/smoke.sh'
              - 'cmd/**'
              - 'migrations/**'
              - 'go.mod'
              - 'go.sum'
              - 'Taskfile.yml'
              - '.github/workflows/**'
            openapi:
              - 'api/openapi.yaml'
              - 'internal/common/openapi/all_routes.yaml'
              - '.spectral.yaml'
              - 'Taskfile.yml'
              - '.github/workflows/**'

  # ---------------------------------------------------------------------------
  # lint — vet + golangci-lint + govulncheck + binary build.
  # Parallel with unit + architecture + integration.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_lint.yml

  # ---------------------------------------------------------------------------
  # unit — race + shuffle + coverage + JUnit. Skips arch/meta tests.
  # ---------------------------------------------------------------------------
  unit:
    name: Unit
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_go-test.yml
    with:
      job-name: unit
      task-name: ci:test
      junit-path: junit-unit.xml
      coverage-path: coverage.out
      coverage-artifact-name: coverage-unit

  # ---------------------------------------------------------------------------
  # architecture — TestArch_* + TestMeta_* across all arch-test packages.
  # Cheap (~30s); parallel with unit + integration.
  # ---------------------------------------------------------------------------
  architecture:
    name: Architecture
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_go-test.yml
    with:
      job-name: architecture
      task-name: ci:test:arch
      junit-path: junit-architecture.xml
      timeout-minutes: 5

  # ---------------------------------------------------------------------------
  # integration — matrix-sharded by module. 7 shards run in parallel on
  # separate runners. Wall-time = max(shard) ≈ 2-3 min, vs ~5+ min if
  # serialized. Each shard pre-pulls postgres:17-alpine + invokes
  # `task ci:test:int:shard` with SHARD + PKG env vars.
  #
  # When adding a new module: append one matrix entry. The Taskfile
  # variant + the per-shard junit-path naming take care of the rest.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration
    needs: changes
    if: needs.changes.outputs.go == 'true' || github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: identity,       pkg: ./internal/identity/... }
          - { name: inventory,      pkg: ./internal/inventory/... }
          - { name: common,         pkg: ./internal/common/... }
          - { name: cmd-api,        pkg: ./cmd/api/... }
          - { name: platform,       pkg: ./internal/platform/... }
          - { name: crm,            pkg: ./internal/crm/... }
          - { name: cmd-bootstrap,  pkg: ./cmd/bootstrap/... }
    uses: ./.github/workflows/_go-test.yml
    with:
      job-name: integration-${{ matrix.name }}
      task-name: ci:test:int:shard
      junit-path: junit-integration-${{ matrix.name }}.xml
      coverage-path: coverage-integration-${{ matrix.name }}.out
      coverage-artifact-name: coverage-integration-${{ matrix.name }}
      env-shard: ${{ matrix.name }}
      env-pkg: ${{ matrix.pkg }}
      needs-docker: true

  # ---------------------------------------------------------------------------
  # openapi-lint — Spectral against api/openapi.yaml. Pinned via Taskfile
  # SPECTRAL_VERSION; CI invokes `task ci:openapi`.
  # ---------------------------------------------------------------------------
  openapi-lint:
    name: OpenAPI Lint
    needs: changes
    if: needs.changes.outputs.openapi == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_openapi.yml

  # ---------------------------------------------------------------------------
  # migrations-check — apply all migrations to ephemeral Postgres on PRs
  # touching migrations/ OR cmd/migrate/. Catches schema-level errors.
  # ---------------------------------------------------------------------------
  migrations-check:
    name: Migrations
    needs: changes
    if: needs.changes.outputs.migrations == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_migrations.yml

  # ---------------------------------------------------------------------------
  # docker — build api + migrate images, then boot full compose + smoke.
  # Two-job chain inside the reusable workflow (build → smoke).
  # ---------------------------------------------------------------------------
  docker:
    name: Docker
    needs: changes
    if: needs.changes.outputs.docker == 'true' || github.event_name == 'push'
    uses: ./.github/workflows/_docker.yml
