name: CI

# ============================================================================
# Three jobs:
#   unit           — restore, build, vet, lint, unit tests, vuln scan, build
#                    binaries. No Docker. ~3-5 min. Trait filter: TestArch_*
#                    excluded so the architecture job has the only signal.
#   architecture   — TestArch_* runs only this surface. Standalone so a
#                    contract failure (event marker missing, framework leak,
#                    alias regex break) shows distinctly. ~30s cold.
#   integration    — //go:build integration files. Testcontainers Postgres
#                    spun per-test (no services-block — testcontainers is the
#                    canonical Go pattern). gotestsum produces JUnit XML.
#                    ~3-10 min warm.
#
# JUnit XML reporting via gotestsum + dorny/test-reporter — failures annotate
# at file:line on the PR Files tab the same way the .NET trx upload does.
#
# Modelled after .NET LeadKart ci.yml pattern (split build/arch/integration)
# + Marten / Wolverine canonical Critter-Stack workflows.
# ============================================================================

on:
  pull_request:
  push:
    branches: [main, "feature/**", "fix/**", "ci/**", "refactor/**"]

# Cancel in-progress runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write   # dorny/test-reporter writes a Checks run
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit job — fast feedback. No Docker. Excludes architecture tests so they
  # surface in their own job. Includes vuln scan (govulncheck) + binary build
  # so we know `cmd/api` + `cmd/migrate` compile.
  # ---------------------------------------------------------------------------
  unit:
    name: Build / Lint / Unit Tests / Vuln
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Pin Go from go.mod (2026 canon — single source of truth).
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint v2 strict)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          args: --timeout=5m

      # Install gotestsum once for both unit + integration jobs.
      # gotestsum gives canonical JUnit XML output (dotnet trx equivalent).
      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # Unit tests with race + shuffle + coverage. -run skips TestArch_*
      # so the architecture job is the sole signal for arch failures.
      - name: Unit tests (race + shuffle + coverage, skipping TestArch_*)
        run: |
          gotestsum \
            --junitfile=junit-unit.xml \
            --format=testname \
            -- -race -shuffle=on -coverprofile=coverage.out \
               -skip="^TestArch_" \
               ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.out
          retention-days: 7

      - name: Upload unit test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-unit
          path: junit-unit.xml
          retention-days: 7

      - name: Annotate test failures (PR Checks)
        # `always()` keeps the reporter running on test failure so failed
        # cases get annotated. `hashFiles(...) != ''` skips when the
        # gotestsum step was itself skipped (e.g. lint above failed first)
        # so there's no junit XML to report against — avoids dorny's
        # "No test report files were found" CI annotation noise.
        if: always() && hashFiles('junit-unit.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: Unit Tests
          path: junit-unit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build all binaries
        run: go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/...

  # ---------------------------------------------------------------------------
  # Architecture tests. Mirrors .NET LeadKart's `architecture-tests` job —
  # standalone so a contract failure (event missing TenantScoped marker, alias
  # regex violation, forbidden framework import in IntegrationEvents) shows
  # up distinctly instead of buried in the unit-test list. Cheap (~30s).
  # ---------------------------------------------------------------------------
  architecture:
    name: Architecture Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # Run ONLY TestArch_* — the build-time package compile already covers
      # the rest of the integrationevents package surface.
      - name: Run architecture tests
        run: |
          gotestsum \
            --junitfile=junit-architecture.xml \
            --format=testname \
            -- -run "^TestArch_" -shuffle=on \
               ./internal/identity/integrationevents/...

      - name: Upload architecture test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-architecture
          path: junit-architecture.xml
          retention-days: 7

      - name: Annotate architecture failures (PR Checks)
        if: always() && hashFiles('junit-architecture.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: Architecture Tests
          path: junit-architecture.xml
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # Integration tests — //go:build integration files. Per testcontainers-go
  # canonical CI guidance (golang.testcontainers.org/system_requirements/ci/),
  # GitHub-hosted runners ship Docker preinstalled — testcontainers picks it
  # up without further config.
  #
  # No services-block Redis: cache tests use miniredis (in-memory). When
  # production-Redis-only behaviour needs verification (cluster mode, eviction
  # policies under contention), add `services: redis: image: redis:7-alpine`
  # alongside the existing pre-pull step.
  # ---------------------------------------------------------------------------
  integration:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Pre-pull Postgres image — testcontainers does it on first use, but
      # pre-pulling parallelises with module download + speeds up the first
      # test by ~30s on a cold cache.
      - name: Pre-pull Postgres image
        run: docker pull postgres:17-alpine

      - name: Verify modules
        run: go mod download

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      # `-tags=integration` enables the //go:build integration files.
      # `-timeout=15m` accommodates testcontainers cold-start + multiple
      # per-test container spins; warm cache typically settles under 5min.
      - name: Integration tests
        run: |
          gotestsum \
            --junitfile=junit-integration.xml \
            --format=testname \
            -- -race -shuffle=on -tags=integration -timeout=15m \
               -coverprofile=coverage-integration.out \
               ./...

      - name: Upload integration coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-integration
          path: coverage-integration.out
          retention-days: 7

      - name: Upload integration test results (JUnit)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-integration
          path: junit-integration.xml
          retention-days: 7

      - name: Annotate integration failures (PR Checks)
        if: always() && hashFiles('junit-integration.xml') != ''
        uses: dorny/test-reporter@v2
        with:
          name: Integration Tests
          path: junit-integration.xml
          reporter: java-junit
          fail-on-error: false

  # ---------------------------------------------------------------------------
  # Docker build — proves the production Dockerfile builds clean for both
  # api + migrate targets on every PR. No push, no sign, no scan — just
  # `docker buildx build --target=...`. Catches:
  #   - bind-mount COPY drift (the /src/migrations bug)
  #   - GO_VERSION ARG vs go.mod toolchain drift
  #   - target rename / new target without registry update
  # ~2 min warm cache. Cheaper than the full release.yml multi-arch +
  # cosign + Syft + Trivy pipeline; that ships only on tag.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build (api + migrate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # No --push, no --platform=multi-arch — single-arch local build is
      # enough to validate the Dockerfile shape. release.yml does the
      # multi-arch + push when a tag fires.
      - name: Build api target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          load: true
          tags: leadkart-go-api:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=api-pr
          cache-to: type=gha,scope=api-pr,mode=max

      - name: Build migrate target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: migrate
          push: false
          load: true
          tags: leadkart-go-migrate:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=migrate-pr
          cache-to: type=gha,scope=migrate-pr,mode=max

      # Verify the api binary's HEALTHCHECK CLI flag works inside the
      # built image — guards against the binary breaking its own probe
      # contract (a future change could regress the -healthcheck path).
      # We expect exit 1 because there's no admin listener bound here;
      # the value is "binary parses the flag + exits with the documented
      # shape" rather than "probe succeeds."
      - name: Verify -healthcheck flag in built image
        run: |
          docker run --rm --entrypoint /api \
            leadkart-go-api:pr-${{ github.event.pull_request.number || github.sha }} \
            -healthcheck \
            && echo "UNEXPECTED: healthcheck exited 0 with no listener" && exit 1 \
            || echo "OK: healthcheck exited non-zero as expected"

  # ---------------------------------------------------------------------------
  # Container smoke — boots the full compose stack (postgres + redis +
  # migrate + api built locally), runs scripts/smoke.sh against it,
  # tears down. End-to-end happy-path validation: register tenant →
  # login → refresh → logout → revoked-token replay returns 401.
  #
  # Catches:
  #   - OTel SDK init failures (the semconv schema-URL bug)
  #   - Migration apply failures against the real Postgres image
  #   - JWT validator config drift
  #   - Probe wiring (admin listener vs public listener separation)
  #
  # ~3-5 min: image build (cached after docker-build job) + compose up +
  # 5 curl round-trips + tear-down.
  # ---------------------------------------------------------------------------
  container-smoke:
    name: Container Smoke (compose up + scripts/smoke.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Compose --profile full builds api + migrate locally. cache-from
      # the docker-build job's GHA scope so we re-use already-warmed
      # buildx layers instead of re-downloading the toolchain.
      - name: Bring up full stack
        run: |
          docker compose -f docker/compose.yml --profile full up -d --build
          docker compose -f docker/compose.yml --profile full ps

      - name: Wait for api healthy (max 60s)
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' leadkart-api 2>/dev/null || echo "starting")
            echo "[$i] api health: $status"
            [[ "$status" == "healthy" ]] && exit 0
            sleep 2
          done
          echo "api never reached healthy"
          docker compose -f docker/compose.yml --profile full logs api --tail=100
          exit 1

      - name: Run smoke script
        run: bash scripts/smoke.sh

      - name: Dump api logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml --profile full logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml --profile full down -v
