name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel in-progress runs on the same ref to save CI minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Build / Lint / Test / Vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin Go from go.mod (2026 canon — single source of truth)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Vet
        run: go vet ./...

      - name: Lint (golangci-lint v2 strict)
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.0.2
          args: --timeout=5m

      - name: Test (race + shuffle + coverage)
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

      - name: Vulnerability scan (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Build all binaries
        run: go build -trimpath -ldflags="-s -w" -o bin/ ./cmd/...
