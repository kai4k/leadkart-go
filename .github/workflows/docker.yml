name: Docker

# Docker pipeline lives in its own workflow so the `paths:` filter
# can gate it independently of the main CI pipeline. Rationale:
#
#   - docker-build catches Dockerfile / build-context drift.
#   - container-smoke catches OTel boot failures, migration apply
#     failures, JWT validator drift, probe wiring.
#
# Both ONLY tell us something useful when Docker-related files
# (Dockerfile, docker/, scripts/smoke.sh, ci.yml itself) or compiled
# code (Go binaries, migrations, sqlc-bound queries) change. A pure
# documentation or domain-test change can never break them. Gating
# on `paths:` collapses the run to zero on those PRs.
#
# Non-Docker code changes still get coverage on the main-branch push
# trigger, so a Go-only PR that breaks the binary's boot path is
# caught when it lands on main (with the unit + integration jobs
# already having been the pre-merge gate). Acceptable trade per the
# free-tier minute budget.

on:
  pull_request:
    paths:
      - 'docker/**'
      - 'scripts/smoke.sh'
      - 'cmd/**'
      - 'migrations/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker.yml'
  push:
    branches: [main]

# Cancel in-progress runs on the same ref to save CI minutes.
concurrency:
  group: docker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # Docker build — proves the production Dockerfile builds clean for both
  # api + migrate targets. No push, no sign, no scan — just
  # `docker buildx build --target=...`. Catches:
  #   - bind-mount COPY drift
  #   - GO_VERSION ARG vs go.mod toolchain drift
  #   - target rename / new target without registry update
  # ~2 min warm cache. release.yml ships the full multi-arch + cosign
  # + Syft + Trivy pipeline on tag.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build (api + migrate)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          load: true
          tags: leadkart-go-api:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=api-pr
          cache-to: type=gha,scope=api-pr,mode=max

      - name: Build migrate target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: migrate
          push: false
          load: true
          tags: leadkart-go-migrate:pr-${{ github.event.pull_request.number || github.sha }}
          cache-from: type=gha,scope=migrate-pr
          cache-to: type=gha,scope=migrate-pr,mode=max

      - name: Verify -healthcheck flag in built image
        run: |
          docker run --rm --entrypoint /api \
            leadkart-go-api:pr-${{ github.event.pull_request.number || github.sha }} \
            -healthcheck \
            && echo "UNEXPECTED: healthcheck exited 0 with no listener" && exit 1 \
            || echo "OK: healthcheck exited non-zero as expected"

  # ---------------------------------------------------------------------------
  # Container smoke — boots the full compose stack + runs scripts/smoke.sh.
  # End-to-end happy-path validation: register tenant → login → refresh →
  # logout → revoked-token replay returns 401.
  # ---------------------------------------------------------------------------
  container-smoke:
    name: Container Smoke (compose up + scripts/smoke.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker-build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up full stack
        run: |
          docker compose -f docker/compose.yml --profile full up -d --build
          docker compose -f docker/compose.yml --profile full ps

      - name: Wait for api healthy (max 60s)
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{.State.Health.Status}}' leadkart-api 2>/dev/null || echo "starting")
            echo "[$i] api health: $status"
            [[ "$status" == "healthy" ]] && exit 0
            sleep 2
          done
          echo "api never reached healthy"
          docker compose -f docker/compose.yml --profile full logs api --tail=100
          exit 1

      - name: Run smoke script
        run: bash scripts/smoke.sh

      - name: Dump api logs on failure
        if: failure()
        run: docker compose -f docker/compose.yml --profile full logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker/compose.yml --profile full down -v
