name: CodeQL

# ============================================================================
# GitHub semantic code analysis for Go. Runs:
#   - on every push to main
#   - on every PR targeting main
#   - weekly (Monday 05:32 UTC) — picks up newly-published CodeQL queries
#     against an unchanged tree, mirrors the GitHub-recommended schedule
#     from github/codeql-action canonical docs.
#
# Findings surface in the Security tab → Code scanning. SARIF is uploaded
# to the same backend as Trivy results from release.yml so a single
# dashboard answers "what is currently broken in this repo".
# ============================================================================

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "32 5 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` is the strictest default query suite —
          # includes both security findings AND code-quality smells the
          # default suite misses. Mirrors GitHub's own recommended setup
          # for production repos.
          queries: security-and-quality

      # `autobuild` runs `go build ./...` for Go projects. Sufficient for
      # leadkart-go's vanilla module — no codegen, no protobuf, no
      # special build steps needed before analysis.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
