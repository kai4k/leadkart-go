# golangci-lint v2 schema (released 2024) — strict 2026 SaaS profile.
# https://golangci-lint.run/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard       # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - revive              # successor to deprecated golint
    - gosec               # security
    - gocritic            # opinionated correctness/style/perf
    - misspell
    - perfsprint          # flags fmt.Sprintf("%s", x) etc.
    - errorlint           # err == io.EOF instead of errors.Is
    - bodyclose           # http.Response.Body leaks
    - noctx               # net/http calls without context
    - nilnil              # antipattern: returning nil, nil
    - cyclop              # cyclomatic complexity cap
    - testifylint
    - sqlclosecheck
    - tagliatelle         # struct tag naming consistency

  exclusions:
    rules:
      # Tests get a pass on a few rules.
      - path: _test\.go
        linters: [errcheck, gosec, cyclop]
      # sqlc-generated code lives under <module>/adapters/db/ (ADR 0037).
      # Generated SQL string literals trip gosec's G101 false-positive
      # heuristic when table / column names contain substrings like
      # "credit" / "credential" / "secret" / "token" (e.g. lead_credits,
      # password_reset_token_hash). The generator output isn't hand-
      # written; we don't author secrets in SQL literals.
      - path: adapters/db/.*\.sql\.go
        linters: [gosec]

  settings:
    cyclop:
      # 20 accommodates the orchestrator + auth handlers (TenantOnboarding,
      # Login, Refresh) which legitimately branch on a handful of well-named
      # business cases. Industry parallels: SonarQube default 15 is too
      # tight for command handlers; 20 is the line many Go SaaS shops draw.
      max-complexity: 20
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: unused-parameter
    tagliatelle:
      case:
        rules:
          json: snake
          yaml: snake

# Formatters (gci + gofumpt) are doctrine per `.claude/rules/
# coding-standards.md`, but they're gated behind a separate
# `golangci-lint fmt` invocation. We run them locally via
# `task fmt` (declared in Taskfile.yml). CI doesn't auto-fix —
# it only verifies. Formatters re-enable here once the `tool`
# directive in go.mod lists gofumpt + gci so the action can
# install them from the locked manifest, not from @latest.
# formatters:
#   enable:
#     - gofumpt
#     - gci
#   settings:
#     gci:
#       sections:
#         - standard
#         - default
#         - prefix(github.com/leadkart/leadkart-go)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
