    # ===== Roles =======================================================
    RoleDto:
      type: object
      required: [id, tenant_id, name, is_system_default, is_super_admin, hierarchy_level, permissions, created_at]
      properties:
        id:               { type: string, format: uuid }
        tenant_id:        { type: string, format: uuid }
        name:             { type: string }
        is_system_default: { type: boolean }
        is_super_admin:   { type: boolean }
        hierarchy_level:  { type: integer }
        permissions:
          type: array
          items: { type: string }
        created_at:       { type: string, format: date-time }
        parent_role_id:
          type: string
          format: uuid
          description: |
            ADR 0058 (Wave 9.4) — populated from the active edge in
            `identity.role_hierarchy_edges` via JOIN at read time.
            Omitted when the role is a root (no active edge). Permission
            resolution stays flat per role; the hierarchy is consumed
            by approval workflows + reporting, NOT by the resolver.

    ListRolesResponse:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleDto' }

    CreateRoleRequest:
      type: object
      required: [name, hierarchy_level]
      properties:
        name:             { type: string, minLength: 2, maxLength: 100 }
        hierarchy_level:  { type: integer, minimum: 0, maximum: 99 }
        parent_role_id:
          type: string
          format: uuid
          description: |
            ADR 0058 (Wave 9.4) — optional parent for the new role.
            Omit / empty = root (no edge created). When set the role
            + the rolehierarchy.Edge are inserted in one transaction;
            cross-tenant + self-reference + cycle prevention runs at
            the DB layer (composite FK + check + cycle trigger).

    CreateRoleResponse:
      type: object
      required: [role_id]
      properties:
        role_id: { type: string, format: uuid }

    UpdateRoleRequest:
      type: object
      description: |
        Both fields optional. Empty `name` skips rename. Omitting
        `hierarchy_level` (or sending `null`) skips re-level — using a
        pointer field instead of a -1 sentinel keeps the wire shape clean.
      properties:
        name:            { type: string, minLength: 2, maxLength: 100 }
        hierarchy_level: { type: integer, minimum: 0, maximum: 99, nullable: true }

    ReplaceRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string }

    RolePermissionRequest:
      type: object
      required: [permission]
      properties:
        permission: { type: string }

    SetRoleParentRequest:
      type: object
      description: |
        ADR 0058 (Wave 9.4) — PATCH body for
        `/api/v1/roles/{roleId}/parent`. Pass `null` (or empty string)
        to clear the parent (role becomes a root by soft-deleting any
        active edge); pass a UUID referencing a role in the same
        tenant to atomically replace any existing edge.
      required: [parent_role_id]
      properties:
        parent_role_id:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string
          minLength: 10
          maxLength: 1024
          description: |
            Optional audit text recorded on the new edge (when setting)
            OR the cleared edge (when clearing). When supplied must be
            10-1024 characters per the DB CHECK constraint.

