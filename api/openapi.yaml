        '204': { description: Deactivated }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`last_owner_protected` — the change would leave the tenant without an active owner; `member_roles_inconsistent` — the member's assigned roles cannot be loaded as this tenant's roles, so its rank cannot be decided; nothing was changed (an assignment row written outside the commands, e.g. an operator repair or a restored backup, pointing at a role of another tenant)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/users/{userId}/reactivate:
    post:
      tags: [users]
      summary: Reactivate a deactivated user
      description: |
        Requires `identity.users.reactivate` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068). Self-target forbidden (`self_modification_forbidden`). The caller must strictly outrank the target member (`insufficient_rank`; owners may act on owners; super users and exempt platform operators are exempt), decided inside the transaction that holds the tenant's authority lock (ADR 0069). Reactivating an OWNER from outside the tenant (a platform operator under `X-Tenant-Id`) needs `platform.tenants.ownership` (`ownership_authority_required`), like deactivating one.
