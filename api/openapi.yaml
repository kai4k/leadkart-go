    # ===== Permission requests (ADR 0055) ==============================
    CreatePermissionRequestRequest:
      type: object
      required: [permission, reason]
      properties:
        permission:
          type: string
          description: Closed-set IdentityPermissions constant (e.g. "identity.users.create")
        duration_days:
          type: integer
          minimum: 1
          maximum: 90
          description: JIT window length in days. Omit to use default (7).
        reason:
          type: string
          minLength: 10
          maxLength: 1024

    CreatePermissionRequestResponse:
      type: object
      required: [request_id, status]
      properties:
        request_id:               { type: string, format: uuid }
        approver_membership_id:   { type: string, format: uuid, description: 'Requester current manager. Empty when the requester has no manager — only an operator holding operator authority can approve.' }
        status:                   { type: string, enum: [pending] }

    ApprovePermissionRequestRequest:
      type: object
      properties:
        decision_reason:
          type: string
          maxLength: 1024
          description: Optional context for the approval.

    DenyPermissionRequestRequest:
      type: object
      required: [decision_reason]
      properties:
        decision_reason:
          type: string
          minLength: 1
          maxLength: 1024
          description: REQUIRED on Deny per ADR 0055 audit canon.

    PermissionRequestDto:
      type: object
      required: [id, tenant_id, requester_membership_id, permission, duration_days, reason, state, created_at, updated_at]
      properties:
        id:                       { type: string, format: uuid }
        tenant_id:                { type: string, format: uuid }
        requester_membership_id:  { type: string, format: uuid }
        permission:               { type: string }
        duration_days:            { type: integer }
        reason:                   { type: string }
        state:                    { type: string, enum: [pending, approved, denied, cancelled] }
        approver_membership_id:   { type: string, format: uuid }
        decided_at:               { type: string, format: date-time }
        decision_reason:          { type: string }
        expires_at:               { type: string, format: date-time, description: 'When the bounded grant expires. Set only after Approve.' }
        created_at:               { type: string, format: date-time }
        updated_at:               { type: string, format: date-time }
        can_approve:
          type: boolean
          description: 'Present only on the approver queue (`role=approver`): whether approving this request as asked would pass for the caller. Approve succeeds iff true (barring a change since the list was read).'

