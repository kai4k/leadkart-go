        outcome:                   { type: string, enum: [verified, rejected, busy, no_answer, wrong_number] }
        notes:                     { type: string }
        callback_window_start_at:  { type: string, format: date-time, description: 'Required when outcome=busy' }
        callback_window_end_at:    { type: string, format: date-time, description: 'Required when outcome=busy' }

    LogVerificationCallResponse:
      type: object
      required: [call_id]
      properties:
        call_id: { type: string, format: uuid, description: 'ID of the verification-call row written to platform.verification_calls.' }

    # ===== CRM (ADR 0060) ==============================================
    CrmLeadDto:
      type: object
      required: [id, tenant_id, stage, temperature, contact_name, phone_e164, has_drug_licence, has_gst, gst_verified, created_at]
