        pincode:           { type: string, pattern: '^[0-9]{6}$' }
        city:              { type: string }
        district:          { type: string }
        state:             { type: string }
        street:            { type: string }
        has_drug_licence:  { type: boolean }
        has_gst:           { type: boolean }
        gst_number:        { type: string, description: 'Required when has_gst=true; GSTIN format' }
        has_pan:           { type: boolean }
        pan_number:        { type: string, description: 'Required when has_pan=true; PAN format' }
        business_type:     { type: string, enum: [PCD, ThirdParty] }
        medicine_system:   { type: string, enum: [Allopathic, Ayurvedic] }
        product_ranges:    { type: array, items: { type: string } }
        dosage_forms:      { type: array, items: { type: string } }
        order_value:       { type: string, enum: [Below5000, Upto25000, Upto50000, Above50000] }
        buy_timeline:      { type: string, enum: [WithinWeek, Within15Days, WithinMonth] }

