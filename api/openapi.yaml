    ListBatchesResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/BatchDto' }
        has_more:    { type: boolean }
        next_cursor: { type: string }

    MovementDto:
      type: object
      required: [id, batch_id, product_id, tenant_id, type, quantity, quantity_on_hand_after, reason, actor_membership_id, occurred_at]
      properties:
        id:                       { type: string, format: uuid }
        batch_id:                 { type: string, format: uuid }
        product_id:               { type: string, format: uuid }
        tenant_id:                { type: string, format: uuid }
        type:                     { type: string, enum: [inbound, outbound, adjustment, reservation, release] }
        quantity:                 { type: integer, format: int64, description: 'Signed delta; Outbound is negative.' }
        quantity_on_hand_after:   { type: integer, format: int64, minimum: 0 }
        reason:                   { type: string, minLength: 1, maxLength: 500 }
        actor_membership_id:      { type: string, format: uuid }
        source_reference:         { type: string, maxLength: 200, description: 'Optional opaque external reference (future OrderID, PurchaseOrderID).' }
        occurred_at:              { type: string, format: date-time }

    LogMovementRequest:
      type: object
      required: [type, quantity, reason]
      properties:
        type:             { type: string, enum: [inbound, outbound, adjustment, reservation, release] }
        quantity:         { type: integer, format: int64, minimum: 1, description: 'Positive magnitude; direction implicit in type.' }
        reason:           { type: string, minLength: 1, maxLength: 500 }
        source_reference: { type: string, maxLength: 200 }

    LogMovementResponse:
      type: object
      required: [movement_id, quantity_on_hand_after]
      properties:
        movement_id:            { type: string, format: uuid }
        quantity_on_hand_after: { type: integer, format: int64, minimum: 0 }

    ListMovementsResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MovementDto' }
        has_more:    { type: boolean }
        next_cursor: { type: string }
