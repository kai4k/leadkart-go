# LeadKart Go — Canonical HTTP API contract per ADR 0046.
#
# Source of truth for: TypeScript client generation (openapi-typescript),
# interactive docs (Scalar @ /docs), Postman/Insomnia import, mock servers
# (Prism / Mockoon), partner-integration handshakes.
#
# Maintenance: every PR touching internal/identity/ports/*.go MUST update
# this file if the change affects wire shape. Future arch test will enforce.
#
# Versioning: info.version follows semver. v1 paths stay stable; breaking
# changes land as a parallel v2.yaml per separate API-versioning ADR.

openapi: 3.1.0

info:
  title: LeadKart API
  version: 0.2.0
  description: |
    LeadKart Identity + Platform API. Multi-tenant SaaS for Indian PCD pharma.

    **Auth:** Bearer JWT in `Authorization` header. Tokens obtained via
    `POST /api/v1/auth/login`. Access tokens live 600 seconds (10 minutes,
    `jwt.AccessTokenTTL`); `access_token_expires_at` in the login and refresh body is
    authoritative, so refresh before it. Refresh via `POST /api/v1/auth/refresh` with
    the refresh token from the login body. `401` with `WWW-Authenticate: Bearer` means
    re-authenticate (`unauthenticated` or `stale_token`); a `403` or `400` never carries
    the challenge.
    A change to a member's roles, permission overrides or status (assign or revoke a
    role, replace overrides, deactivate, reactivate, approve a permission request)
    rotates that person's security stamp: their next request with the old access
    token answers `401` with `error: stale_token` and `WWW-Authenticate: Bearer
    realm="leadkart"`, the same answer as a password change, and a refresh
    re-mints the token from the current roles (new `rank` and permissions). The
    refresh session is NOT ended, except by deactivation, which also revokes the
    member's refresh tokens. Every authority command also decides on the acting
    member's CURRENT roles and permissions, never on the token alone: a token can
    only lose authority relative to the stored facts (403 `forbidden` when the acting
    member no longer exists or is inactive, otherwise the usual `insufficient_rank` /
    `grant_exceeds_authority`).

    **Forced password change (ADR 0053 / ADR 0068 D8):** a person provisioned with
    a temporary credential (a tenant's first admin, a member created with
    `POST /api/v1/users`) holds `must_change_password`. The API enforces it: the
    access token carries the flag, login AND refresh mint it from the stored person
    and return it as `must_change_password`, and every authenticated route except
    `POST /api/v1/auth/change-password` and `GET /api/v1/auth/me/capabilities`
    answers `403` with `error: password_change_required` (no `WWW-Authenticate`:
    this is not a session problem, do not refresh). Changing the password rotates
    the security stamp AND ends every refresh session of the person in the same
    transaction (the access token carries no session id, so the caller's own session
    is not spared): the flagged token answers `401 stale_token`, every refresh token
    the person held answers `401`, and the next LOGIN with the new password carries no
    flag. A password reset (`POST /api/v1/auth/reset-password`) ends all sessions the
    same way. Login, refresh, logout and the
    emailed-token flows are anonymous and unaffected. Tokens minted before the
    claim existed carry no flag.

    **Impersonation tokens (ADR 0045 / ADR 0069):** a token minted by an impersonation
    session (`aud: leadkart-impersonation`, with an `act` claim; the two always
    travel together, otherwise the token is `401`) is only as alive as its session:
    once the session ends or expires every route answers `401 stale_token`. While it
    lives it is Admin-equivalent in the target tenant and is refused with `403
    impersonation_not_allowed` on every `/api/v1/platform/*` route EXCEPT two reads of
    the scoped tenant's own data, `GET /api/v1/platform/marketplace/leads` and
    `GET /api/v1/platform/lead-credits/balance` (they are gated by tenant permissions;
    the marketplace purchase stays refused), on tenant
    registration, tenant suspend / activate / mark-for-deletion / restore,
    `GET /api/v1/search`, `POST /api/v1/users/{userId}/anonymise`, and the routes that
    act on "the caller": change password, request email change, sessions, own
    activity, and permission-request submit / approve / deny / cancel. Capabilities
    and the permission-request reads stay available.

    **Multi-tenant scope:** every authenticated call carries the caller's
    `tenant_id` claim implicitly. Platform operators (`is_platform=true` JWT)
    select a tenant per request via the `X-Tenant-Id` header (ADR 0039):
    honoured only for platform operators; ignored for everyone else; the
    path tenant wins on `/tenants/{tenantId}` routes; routes where it cannot
    apply (auth, platform-wide) ignore it. Errors: 400
    `invalid_tenant_scope` / `tenant_scope_conflict`, 404
    `tenant_scope_not_found`, 409 `tenant_not_active`, 403
    `tenant_scope_not_supported` (see the `X-Tenant-Id` parameter).
    Operators can also open an impersonation
    session for sustained tenant-scoped work (see
    `POST /api/v1/platform/impersonation/sessions`).

    **Errors:** RFC 9457 Problem Details shape with LeadKart legacy
    `error`/`message` fields preserved for backward compat. See
    [ErrorResponse](#/components/schemas/ErrorResponse).

    **Pagination:** cursor (keyset) per ADR 0038. Lists return
    `{ items, has_more, next_cursor }`; pass `cursor=<opaque>` to fetch
    next page. No total counts.

    **Authorization error codes:** `403` responses carry `forbidden` (missing
    permission or wrong tenant), `self_modification_forbidden` (caller targeted
    their own roles, permission overrides, status or manager) and
    `grant_exceeds_authority` (caller tried to confer or remove a permission
    they do not hold), `insufficient_rank` (the caller does not strictly
    outrank the target member or role), `ownership_authority_required` (a platform
    operator under `X-Tenant-Id` changing a tenant's ownership without
    `platform.tenants.ownership`), `admin_tier_required` (owner ruling 2026-11-21: only the Company Owner and
    Administrator tier, and platform operators, add users, so `identity.users.create` is used, held, requested or
    conferred only at that tier), `impersonation_not_allowed`
    (a caller who may not decide a request is answered
    `404 permission_request_not_found`). Editing a
    role acts on its holders, active or not (`insufficient_rank`,
    `self_modification_forbidden`; owners may edit a role they hold); lifting a member's explicit revoke needs the
    Admin tier, and conferring a permission the caller holds only until a date
    is refused (`grant_exceeds_authority`). Rank is `GET /auth/me/capabilities`
    `rank` / `tier` (0 owner, 1-10 admin, 11-20 manager, 21-30 team_lead, 31-99
    user; lower is more senior). ADR 0036 / ADR 0068 / ADR 0069. State conflicts
    on the membership, role and person commands are `409`: `last_owner_protected`,
    `owner_protected`, `member_roles_inconsistent`, `role_system_default`,
    `role_in_use`, `person_memberships_changing`, `person_active_elsewhere`; input the policy refuses is `422`:
    `manager_not_eligible`, `role_parent_not_eligible`,
    `role_level_breaks_reporting`, `permission_not_requestable`. In `x-required-permissions`, the token `self`
    is not a permission: it means "the caller's own membership" (the path
    user id equals the caller's `membership_id`).

    **Email addresses:** `format: email` appears on request bodies only. Responses carry the
    stored address as written (the server accepts internationalised domains and unusual local
    parts that a strict `format: email` validator in a generated client would reject).

    **Enumeration safety:** guessable-key lookups (`/by-slug/`, `?email=`)
    return 404 indistinguishably whether the resource doesn't exist OR
    the caller lacks access. Per ADR 0044.
  contact:
    name: LeadKart Engineering
  license:
    name: Proprietary

servers:
  - url: https://api.leadkart.io
    description: Production
  - url: http://localhost:8080
    description: Local dev

tags:
  - name: auth
    description: Login, refresh, logout, password + email change flows
  - name: capabilities
    description: Caller-self introspection (`/me/*`)
  - name: sessions
    description: Refresh-token family management (per-device sign-out)
  - name: tenants
    description: Tenant CRUD + lifecycle (same-tenant or platform operator)
  - name: users
    description: Tenant membership management
  - name: roles
    description: Per-tenant role + permission assignment
  - name: platform
    description: Cross-tenant operator surface (Platform-only)
  - name: search
    description: Operator omni-search (Cmd+K)
  - name: audit
    description: Audit-log read endpoints
  - name: permission-requests
    description: Permission-elevation approval workflow (ADR 0055)
  - name: Platform
    description: Platform bounded context (ADR 0059) — verification pipeline, marketplace, lead credits
  - name: inventory
    description: Product / Batch / StockMovement aggregates per BRD §6.5 (ADR 0061)
  - name: crm
    description: CRM lead lifecycle — assignment, stage/temperature, calls, convert/lose (ADR 0060)
  - name: tasks
    description: WorkItem aggregate — task creation, state machine, hierarchy-gated reassignment, dashboards (BRD §6.8)
  - name: dispatch
    description: ConsignmentNote aggregate — slot creation + carrier status lifecycle (pending → dispatched → in_transit → delivered | failed) per BRD §6.6 (ADR 0063)
  - name: orders
    description: Quotation / Order / Invoice / CreditNote / Payment aggregates — quote→order fulfillment lifecycle + gapless FY invoice numbering per BRD §6.4 (ADR 0063)

security:
  - BearerAuth: []

paths:
  # ===== AUTH ============================================================
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Exchange credentials for ⟨access, refresh⟩ tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '503': { $ref: '#/components/responses/ServiceBusy' }
        '200':
          description: Tokens issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            `tenant_suspended`: the password was CORRECT but the person's company is
            suspended (an operator suspended it; reactivation restores sign-in). It is
            answered only after the password was verified, so a wrong password or an unknown
            email still answers `401 invalid_credentials` and the code tells a stranger
            nothing. `tenant_not_active`: the password was CORRECT but the company is
            neither active nor suspended nor deleted, that is `pending` or marked for
            deletion (`pending_deletion`); same rule (owner ruling 2026-11-21: only an active
            company's members sign in; restoring the company or an operator's activation
            brings them back). A company registered by an operator is created `active`, so
            its first admin signs in. A deleted company, and one with no usable membership,
            stay `401 invalid_credentials`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '423':
          description: |
            Account locked after [person.MaxFailedLogins] consecutive
            failed login attempts within [person.LockoutWindow] per
            NIST 800-63B §5.2.2 + ADR 0053. Retry-After header carries
            integer seconds until unlock (RFC 7231 §7.1.3 delta-seconds).
            An email with no usable account (unknown, deactivated, anonymised, GLOBALLY
            SUSPENDED) locks on the same schedule and answers identically, so 423 does not
            reveal that an account exists (ADR 0068 D12). While locked, even the correct
            password answers 423.
          headers:
            Retry-After:
              description: Seconds until the account unlocks.
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token + reissue access token
      security: []
      description: >
        Rotates the refresh token and reissues the access token. Re-presenting a
        just-rotated token within the grace window (default 30 s, at most 120 s,
        `Refresh.GraceWindow`) returns the SAME successor (a deterministic
        derivation: no new token row is written), so two tabs or a retried request
        after a lost response do not end the session. That holds ONLY for the client
        that rotated the token (the client address the rate limiters use: behind the
        BFF its `X-Forwarded-For`; only a keyed hash of it is stored) and for at most
        3 replays per token. A replay from another client, a 4th replay, a token
        whose consumer was not recorded, a replay outside the window, a token two or
        more generations old, or one whose successor has been used is token reuse:
        the whole family is revoked and the answer is `401 refresh_rejected`. A
        client whose address changes inside the window (a phone switching networks)
        between a lost response and its retry is therefore signed out. A revoked family never answers a
        replay, whatever the window says (logout, password change and reset revoke
        every family of the person). The answer to a replay is indistinguishable
        from the first answer, apart from the access token's own issue time.

        A session ends `Refresh.AbsoluteTTL` (default 14 days,
        `LEADKART_REFRESH__ABSOLUTE_TTL`) after the login that opened it, however often
        it was refreshed: the first refresh after that answers `401 refresh_rejected`
        with `reason: session_expired` (sign in again) and the family is revoked
        (`absolute_ttl`). A session also ends when it sits IDLE: each refresh token lives
        `Refresh.SlidingTTL` (default 24 hours, `LEADKART_REFRESH__SLIDING_TTL`; a session unused for 24 hours ends) from its
        issue, never past the absolute deadline, and every rotation renews it (a grace
        replay does not). The first refresh after the token ran out answers the same
        `401 refresh_rejected` with `reason: session_expired` and the family is revoked
        (`idle_timeout`). A globally suspended person is refused (the family is revoked),
        and so is a member of a SUSPENDED company: `401 refresh_rejected` with
        `reason: tenant_suspended` (the family is revoked as `tenant_suspended`; a
        reactivated company's members sign in again, the old session does not return).
        A member of a company that is `pending` or marked for deletion is refused the same
        way with `reason: tenant_not_active` (the family is revoked as `tenant_not_active`;
        a restored company's members sign in again). A deleted company's members are
        refused without a reason. Suspending a company or marking it for deletion also
        revokes its members' families (outbox subscriber), but an access token already
        issued stays valid until its own expiry (600 s).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: |
            Refresh rejected (consumed / expired / family revoked / reuse). For a session that
            ended by time (absolute lifetime or idle timeout) the body carries
            `reason: session_expired`; for a member of a suspended company
            `reason: tenant_suspended`; for a member of a pending or marked-for-deletion
            company `reason: tenant_not_active`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh-token family
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogoutRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Logged out (idempotent) }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/request-password-reset:
    post:
      tags: [auth]
      summary: Request password reset email
      description: |
        ALWAYS returns 204 regardless of whether the email is registered (Auth0/Okta canon — defeats account
        enumeration). The answer is released no earlier than a fixed 300 ms after the handler starts, so
        response time does not reveal whether the address has an account either. The 300 ms is measured
        from when the handler starts: the limiters and middleware before it are not included.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestPasswordResetRequest' }
      responses:
        '204': { description: Reset request accepted (silent success) }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Confirm password reset using emailed token
      description: |
        The token is validated FIRST (state and expiry), before any password work: an unknown,
        consumed, expired, or suspended-person's token answers `400 reset_token_invalid`
        whatever the password is (an expired pending reset is cleared), so the answer
        reveals nothing about whether an account exists or which tenant it belongs to.
        Only then is the new password checked against the policy of the tenant of the person's
        active membership (the default policy when there is none): only a holder of a live
        token can see `422 password_policy_violation` (field `errors.new_password`) or
        `422 password_breached`. A refused password leaves the token usable but counts: after
        5 refusals the token is invalidated (`400 reset_token_invalid`), so a link cannot be
        probed forever. There is no same-as-current check on a reset (with a valid token it
        would be an oracle for the current password): resetting to the current password
        succeeds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '503': { $ref: '#/components/responses/ServiceBusy' }
        '204': { description: Password reset complete }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422':
          description: |
            `password_policy_violation` (see PasswordPolicyViolation; field `new_password`)
            or `password_breached`. (`password_same_as_current` is change-password only.)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change own password (authenticated)
      description: |
        Current password verified even when authenticated (security.md "Password change").
        Allowed while `must_change_password` is pending: this is the way out of the
        forced-change state. The change rotates the security stamp, clears the flag and,
        in the same transaction, revokes EVERY refresh session of the person (the access
        token carries no session id, so the caller's own session is ended too).
        Contract: `204`; the access token used is now `401 stale_token` (at once on every instance
        when the api's cache is reachable, otherwise within the 30 s lifetime of the cached
        stamp); every refresh
        token the person held is now `401` on refresh; the caller signs in again with the
        new password, and that login (and its refreshes) carries no flag.

        The new password is checked against the password policy of the caller's OWN tenant
        (the token's `tenant_id`, never an operator's acted-on scope; the default policy when
        that tenant is gone) BEFORE the current password is verified, so a refused password
        costs no hashing: `422 password_policy_violation` with `errors.new_password`. A current
        password over 1024 bytes is answered as an incorrect one without being hashed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '503': { $ref: '#/components/responses/ServiceBusy' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/ImpersonationNotAllowed' }
        '204': { description: Password changed }
        '401':
          description: Incorrect current password, or the access token is stale (`stale_token`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `password_policy_violation` (see PasswordPolicyViolation; field `errors.new_password`),
            `password_breached`, or `password_same_as_current`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/request-email-change:
    post:
      tags: [auth]
      summary: Request email-change confirmation link (authenticated)
      description: |
        Authenticated route — PersonID derived from JWT Subject; new email
        in the body. Confirmation link is emailed to the NEW address.
        Per Auth0 / Okta / Microsoft Entra ID canon: ALWAYS returns 204
        regardless of whether the target email is already taken — defeats
        account enumeration. The unique-index at apply time enforces the
        actual constraint via POST /api/v1/auth/confirm-email-change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestEmailChangeRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/SessionRefused' }
        '204': { description: Email-change request accepted (silent on collision) }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/auth/confirm-email-change:
    post:
      tags: [auth]
      summary: Confirm email change via emailed token
      description: |
        Anonymous endpoint (the confirmation token IS the proof). The
        uniqueness check on the target email happens here; a 400 with
        `email_change_token_invalid` covers both expired tokens AND
        target-email collisions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmEmailChangeRequest' }
      responses:
        '204': { description: Email changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ===== CAPABILITIES + ACTIVITY ========================================
  /api/v1/auth/me/capabilities:
    get:
      tags: [capabilities]
      summary: Resolved permission/role/profile bundle for the calling membership
      description: |
        Auth0 `/userinfo` canon. Returns JWT-resident fields (no DB hit) plus
        cached profile enrichment (email + name + role names). The frontend
        uses this to drive nav / tier / button-visibility without decoding
        the JWT. Allowed while `must_change_password` is pending (the response
        reports it, so the front-end can render the forced-change screen).

        `password_policy` is the password policy that binds the caller: the policy
        of the caller's OWN tenant (the tenant of the token, never an operator's
        acted-on `X-Tenant-Id`, which this route ignores), the system default when
        the tenant has none. The system default is 8 characters minimum with an upper-case
        letter, a lower-case letter, a digit and a symbol (owner ruling 2026-11-21; it was 12;
        8 is also the lowest minimum a tenant may set); a tenant that stored its own policy,
        including a stored 12, keeps it. It is the same policy `POST /auth/change-password`
        enforces, so the change-password page (including the forced screen) can show
        the rules before the first attempt. It is read fresh on every call, not from
        the cached bundle. An impersonation session reads this route and sees the
        impersonated tenant's rules (the token's tenant is the impersonated one);
        change-password itself is refused to it.

        There is deliberately NO anonymous policy endpoint. The password-reset page
        learns the rules only from the 422 `password_policy_violation` answer to a
        reset made with a valid token (`errors` lists the failed rule codes): a
        holder of a valid emailed token is the only anonymous party that is told
        anything about the tenant's settings, and the answer is limited to rule
        codes.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CapabilitiesDto' }

  /api/v1/auth/me/activity:
    get:
      tags: [audit]
      summary: Caller's own audit-event feed (keyset-paginated)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/SessionRefused' }
        '200':
          description: Activity page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListAuditEventsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ===== SESSIONS =======================================================
  /api/v1/auth/sessions:
    get:
      tags: [sessions]
      summary: List active sessions for the caller
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/SessionRefused' }
        '200':
          description: Sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListSessionsResponse' }
    delete:
      tags: [sessions]
      summary: Revoke all sessions (optionally excluding current)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RevokeAllSessionsRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/SessionRefused' }
        '200':
          description: Sessions revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeAllSessionsResponse' }

  /api/v1/auth/sessions/{familyId}:
    delete:
      tags: [sessions]
      summary: Revoke a specific session (refresh-token family)
      parameters:
        - name: familyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/SessionRefused' }
        '204': { description: "The caller's own session is revoked now, or already was (idempotent for the owner)" }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: |
            `session_not_found`: no such session, OR it belongs to another person. The two are
            indistinguishable on purpose (no session-id enumeration); a session of the caller
            that is already revoked is 204, not 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ===== TENANTS ========================================================
  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: List tenants matching a filter (Stripe-style query lookup)
      description: |
        Canonical slug-lookup per ADR 0052. Returns `{tenants: [0..1 match]}`.
        Enumeration-safe per ADR 0044 — callers who lack access to the matched
        tenant see an empty list, indistinguishable from "no such slug."

        Supersedes `GET /api/v1/tenants/by-slug/{slug}` (deprecated; grandfathered
        for v0.2 frontend-contract compatibility per ADR 0049).

        v0.2 supports `slug` only; future filters (`status`, `created_after`)
        land per Stripe listing-endpoint canon.

        Requires `identity.tenants.view` (held by a tenant admin through `tenant.admin`, in the
        caller's own tenant) or `platform.tenants.view`; a caller holding neither is refused with
        403 `forbidden`. The response carries the tenant's full profile.
      x-required-permissions: [identity.tenants.view, platform.tenants.view]
      parameters:
        - name: slug
          in: query
          required: true
          description: Tenant slug to look up (URL-safe; lowercase + digits + hyphens).
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: List of matching tenants (length 0 or 1)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListTenantsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
      tags: [tenants]
      summary: Register a new tenant + initial admin user
      description: |
        Platform operators only (is_platform + slug anchor) — ADR 0068. Tenant
        onboarding is operator-led (ADR 0053 "no public sign-up surface").
        Requires `platform.tenants.create`.

        The company is created `active` (the operator's registration is the approval; owner
        ruling 2026-11-21: only an active company's members sign in), so its first admin
        signs in at once. `pending` is produced by no route today.

        The first admin's temporary password is checked against the DEFAULT password policy
        (the new tenant has no stored policy yet; default: 8 characters minimum with an
        upper-case letter, a lower-case letter, a digit and a symbol): `422 password_policy_violation` with
        `errors.admin_password`. Nothing is created on a violation.

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `tenant_invalid (company names) / person_invalid (admin names)` with `errors{<field>: ["invalid_characters"]}` (or `["required"]` / `["too_long"]` for a blank or over-long name) for `legal_name`, `display_name`, `admin_first_name`, `admin_last_name`, and nothing is written.
      security:
        - BearerAuth: []
      x-required-permissions: [platform.tenants.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterTenantRequest' }
      responses:
        '503': { $ref: '#/components/responses/ServiceBusy' }
        '201':
          description: Tenant registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegisterTenantResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Email already has an active membership in another tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            Invalid input, nothing is written. `password_policy_violation` with
            `errors.admin_password` (rule codes). `tenant_invalid` (company names) or
            `person_invalid` (admin names) with `errors{<field>: [<code>]}` for `legal_name`,
            `display_name`, `admin_first_name`, `admin_last_name`; the code is `required`
            (blank), `too_long` (company names over 200 bytes, admin names over 100) or
            `invalid_characters`. A malformed `slug` or `admin_email` is a 400
            (`invalid_slug` / `invalid_email`), not a 422. Never a 500.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/tenants/{tenantId}:
    get:
      tags: [tenants]
      summary: Get tenant by UUID
      description: |
        Requires `identity.tenants.view` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
      x-required-permissions: [identity.tenants.view]
      parameters:
        - { $ref: '#/components/parameters/TenantId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
