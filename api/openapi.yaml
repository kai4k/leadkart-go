        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`person_active_elsewhere` — the person already has an active membership in another company (a person is active in at most one); nothing was changed; `member_roles_inconsistent` — the member's assigned roles cannot be loaded as this tenant's roles, so its rank cannot be decided; nothing was changed", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/users/{userId}/roles:
    post:
      tags: [users]
      summary: Assign a role to a user
      description: |
        Requires `identity.roles.assign` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068). Self-target forbidden (`self_modification_forbidden`). The caller must strictly outrank the target member (`insufficient_rank`; owners may act on owners; super users and exempt platform operators are exempt), decided inside the transaction that holds the tenant's authority lock (ADR 0069). Conferring a permission the caller does not hold is rejected with `grant_exceeds_authority`. Only a super user may assign a super-admin role. The role's level must be below the caller's rank (owners: any tenant role). A deleted or unknown role is `role_not_found`.
