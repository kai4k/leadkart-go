        grand_total_paise:   { type: integer, format: int64 }
        invoice_id:          { type: string, format: uuid }
        consignment_note_id: { type: string, format: uuid }
        confirmed_at:        { type: string, format: date-time }
        packed_at:           { type: string, format: date-time }
        invoiced_at:         { type: string, format: date-time }
        dispatched_at:       { type: string, format: date-time }
        delivered_at:        { type: string, format: date-time }
        completed_at:        { type: string, format: date-time }
        cancelled_at:        { type: string, format: date-time }
        cancellation_reason: { type: string }
        created_at:          { type: string, format: date-time }

    RecordTokenPaymentRequest:
      type: object
      required: [method, amount_paise]
      properties:
        method:             { type: string, enum: [upi, neft, rtgs, imps, cheque, cash, card_offline] }
        amount_paise:       { type: integer, format: int64, minimum: 1 }
        external_reference: { type: string }
        notes:              { type: string }

    PackOrderRequest:
      type: object
      required: [carrier_name, box_count, weight_grams]
      properties:
        carrier_name:         { type: string, minLength: 1 }
        box_count:            { type: integer, format: int32, minimum: 1 }
        weight_grams:         { type: integer, format: int64, minimum: 1 }
        expected_delivery_at: { type: string, format: date-time }

    InvoiceOrderResponse:
      type: object
      required: [invoice_id, number_display]
      properties:
        invoice_id:     { type: string, format: uuid }
        number_display: { type: string }

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 1 }

    RecordPaymentRequest:
      type: object
      required: [kind, method, amount_paise]
      properties:
        kind:               { type: string, enum: [token, full, refund] }
        method:             { type: string, enum: [upi, neft, rtgs, imps, cheque, cash, card_offline] }
        amount_paise:       { type: integer, format: int64, minimum: 1 }
        external_reference: { type: string }
        notes:              { type: string }
        received_at:        { type: string, format: date-time }

    RecordPaymentResponse:
      type: object
      required: [payment_id]
      properties:
        payment_id: { type: string, format: uuid }

    MintCreditNoteRequest:
      type: object
      required: [reason, amount_paise]
      properties:
        reason:       { type: string, minLength: 1 }
        amount_paise: { type: integer, format: int64, minimum: 1 }

    MintCreditNoteResponse:
      type: object
      required: [credit_note_id, number_display]
      properties:
        credit_note_id: { type: string, format: uuid }
        number_display: { type: string }

    PaymentDto:
      type: object
      required: [id, order_id, kind, method, amount_paise, received_at]
      properties:
        id:                 { type: string, format: uuid }
        order_id:           { type: string, format: uuid }
        kind:               { type: string, enum: [token, full, refund] }
        method:             { type: string, enum: [upi, neft, rtgs, imps, cheque, cash, card_offline] }
        amount_paise:       { type: integer, format: int64 }
        external_reference: { type: string }
        received_at:        { type: string, format: date-time }

    ListPaymentsResponse:
      type: object
      required: [payments]
      properties:
        payments: { type: array, items: { $ref: '#/components/schemas/PaymentDto' } }

    InvoiceDto:
      type: object
      required: [id, order_id, number_display, items, subtotal_paise, tax_paise, grand_total_paise, issued_at]
      properties:
        id:                { type: string, format: uuid }
        order_id:          { type: string, format: uuid }
        number_display:    { type: string }
        items: { type: array, items: { $ref: '#/components/schemas/OrderLineItemDto' } }
        subtotal_paise:    { type: integer, format: int64 }
        tax_paise:         { type: integer, format: int64 }
        grand_total_paise: { type: integer, format: int64 }
        issued_at:         { type: string, format: date-time }

    # ===== Notifications ===================================================
    NotificationDto:
      type: object
      required: [id, category, title, state, created_at]
      properties:
        id:                 { type: string, format: uuid }
        category:           { type: string, enum: [lead_assigned, lead_converted, order_confirmed, order_delivered, work_item_assigned, work_item_overdue, stock_expiring, stock_below_reorder, reminder] }
        title:              { type: string }
        body:               { type: string }
        state:              { type: string, enum: [unread, read, dismissed] }
        source_module:      { type: string }
        source_entity_type: { type: string }
        source_entity_id:   { type: string }
        deep_link:          { type: string }
        created_at:         { type: string, format: date-time }
        read_at:            { type: string, format: date-time }
        dismissed_at:       { type: string, format: date-time }

    ListNotificationsResponse:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NotificationDto' }
        has_more:    { type: boolean }
        next_cursor: { type: string }

    UnreadCountResponse:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, format: int64 }

    MarkAllReadResponse:
      type: object
      required: [marked_read]
      properties:
        marked_read: { type: integer, format: int64 }
