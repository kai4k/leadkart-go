        '204': { description: Statutory updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { description: "Conflict with the current state of the resource (see the `error` code)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/tenants/{tenantId}/admin-contact:
    patch:
      tags: [tenants]
      summary: Update tenant admin phone + postal address
      description: |
        A malformed phone or postal address is 422 `validation_failed` with an `errors`
        entry: `phone: ["invalid_phone"]`, or one entry per refused part of the address under
        `address.street`, `address.city`, `address.district`, `address.state`, `address.state_code` or
        `address.pincode`, whose value is `required` (blank), `too_long` (over its limit),
        `invalid_pincode` (not 6 digits with a leading 1-9) or, for `address.city` only, `invalid_city`.
        Each value is a stable code, never a sentence.
        Requires `identity.tenants.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
      x-required-permissions: [identity.tenants.update]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
