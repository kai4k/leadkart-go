  /api/v1/users/{userId}/anonymise:
    post:
      tags: [users]
      summary: Anonymise a user (DPDP §12 / GDPR Art. 17 right-to-erasure; Platform-only)
      description: |
        Cross-tenant blast radius — one Person can hold many Memberships;
        the cascade is gated on Platform tier per multi-tenancy.md
        "SuperUser god-mode" + `identity.users.anonymise` permission.

        Requires `identity.users.anonymise` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `person_invalid` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/UserId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymiseRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: User anonymised }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`last_owner_protected` — the person is the only active owner of a tenant; nothing was changed. `person_memberships_changing` — the person's memberships kept changing while the change was checked (a reactivation raced it); nothing was changed, retry", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ===== ROLES ==========================================================
  /api/v1/roles:
    get:
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      tags: [roles]
      summary: List roles in the caller's tenant
      description: |
        Requires `identity.roles.view` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
      x-required-permissions: [identity.roles.view]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Roles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListRolesResponse' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/XTenantId'
      tags: [roles]
      summary: Create a custom role
      description: |
        Requires `identity.roles.create` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `role_invalid` with `errors{<field>: ["invalid_characters"]}` for `name`, and nothing is written.
      x-required-permissions: [identity.roles.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateRoleRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Role created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateRoleResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '409':
          description: Role name already taken in this tenant (`role_name_taken`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `role_invalid` (name length, `hierarchy_level` outside 1-99) or `role_parent_not_eligible`
            (the parent is missing, deleted, or not strictly more senior than the new role's level).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/roles/{roleId}:
    get:
      tags: [roles]
      summary: Get role by ID
      description: |
        Requires `identity.roles.view` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
      x-required-permissions: [identity.roles.view]
      parameters:
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleDto' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '400': { description: "`invalid_role_id` — the path id is not a role id", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '404': { description: "`role_not_found`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
    patch:
      tags: [roles]
      summary: Rename a role and/or change its hierarchy level
      description: |
        At least one of `name` and `hierarchy_level` is required: a body that carries neither (`{}`, `null`) is
        `400 invalid_body`. An empty `name` skips rename; omitting `hierarchy_level` (or sending `null`) skips
        re-level — using a pointer field instead of a -1 sentinel keeps the wire shape clean.
        Changing what a role confers, re-levelling it or deleting it is acting on every member who holds it, active or
        not: the caller must strictly outrank each holder (owners may act on owners) and must not hold the role
        themself, except an owner, who may edit a custom role they hold (`insufficient_rank`,
        `self_modification_forbidden`); a rename acts on nobody. Every active holder's
        session ends the way an authority change on the member does: their old token answers 401 `stale_token`, the
        refresh succeeds with the new permissions and rank.
        A re-level is refused with 422 `role_level_breaks_reporting` only when it would NEWLY break a reporting line: an
        active holder that is strictly junior to their (active) manager would no longer be, or a direct report that is
        strictly junior to a holder would no longer be. Lines that are already broken, and inactive managers or
        reports, do not block it.
        Requires `identity.roles.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `role_invalid` with `errors{<field>: ["invalid_characters"]}` for `name`, and nothing is written. A full-replace body that re-sends a stored value UNCHANGED is accepted (a value stored before the rule existed never blocks an untouched save); only a changed value is checked.
      x-required-permissions: [identity.roles.update]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRoleRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '204': { description: Role updated }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `role_name_taken`, or `role_system_default` (a system-default role, Company Owner among them, cannot be
            renamed or re-levelled by anyone, super users included).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `validation_failed` / `role_invalid`, or `role_level_breaks_reporting` (the new level would newly break a reporting
            line of an active holder: no longer strictly junior to their manager, or a direct report no longer strictly
            junior to the holder; lines already broken do not count).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    delete:
      tags: [roles]
      summary: Soft-delete a role
      description: |
        Requires `identity.roles.delete` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
        The caller must hold every permission the role carries (deleting removes them from every holder) and must
        be allowed to act on every holder, active or not (answered before `role_in_use`).
        A role still held by an ACTIVE member is refused with 409 `role_in_use` (`errors.active_holders` is the
        count); a role held only by inactive members is deleted and their assignments are removed in the same
        transaction.
      x-required-permissions: [identity.roles.delete]
      parameters:
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Role deleted }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`role_in_use` (an active member holds the role) or `role_system_default` (system-default roles cannot be deleted)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/roles/{roleId}/parent:
    patch:
      tags: [roles]
      summary: Set or clear the role's parent (single-parent hierarchy)
      description: |
        ADR 0058 (Wave 9.4, supersedes ADR 0054) — single-parent
        organizational hierarchy backed by a dedicated
        `identity.role_hierarchy_edges` aggregate. Permission
        resolution stays flat per role; the hierarchy is consumed by
        approval workflows + reporting.

        The `parent_role_id` key is REQUIRED (a body without it is 400
        `invalid_body`): pass `{"parent_role_id": null}` (or an empty string) to
        clear the parent (role becomes a root). Pass a UUID referencing
        a role in the SAME tenant to set / re-point the parent.

        Cycle prevention + cross-tenant safety are declarative at the
        DB layer (composite FK + cycle trigger). Surfaces as 422
        `role_hierarchy_cycle` / `role_hierarchy_cross_tenant`, 400
        `role_hierarchy_self_reference`, 409
        `role_hierarchy_edge_already_exists`.

        Optional `reason` (10-1024 chars) is recorded onto the new
        edge OR the cleared edge for audit.
        Requires `identity.roles.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `role_hierarchy_invalid_reason` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      x-required-permissions: [identity.roles.update]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetRoleParentRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Parent set / cleared }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: |
            `role_system_default` (a system-default role's parent cannot change), or role already has an active parent edge (single-parent
            invariant: at most one active edge per child). Caller
            should reload to discover the existing edge before
            retrying.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: |
            `role_parent_not_eligible` (the parent is missing, deleted, in another tenant, or not strictly more
            senior than the child), or a cycle / cross-tenant refusal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/roles/{roleId}/permissions:
    put:
      tags: [roles]
      summary: Replace the role's permission set atomically
      description: |
        The `permissions` key is REQUIRED and may not be `null`: `{}` and `{"permissions": null}` are 400
        `invalid_body`; an explicit `[]` clears the role. Changing the set requires the caller to hold every
        permission added AND every permission removed.
        Permission names MUST match the closed
        `permission.IdentityPermissions` catalogue; unknown names surface
        as 422 (`permission_unknown`).
        Requires `identity.roles.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068). Conferring a permission the caller does not hold is rejected with `grant_exceeds_authority`.
        Changing what a role confers, re-levelling it or deleting it is acting on every ACTIVE member who holds it: the
        caller must strictly outrank each active holder (owners may act on owners) and must not hold the role
        themself (`insufficient_rank`, `self_modification_forbidden`); a rename acts on nobody. Every active holder's
        session ends the way an authority change on the member does: their old token answers 401 `stale_token`, the
        refresh succeeds with the new permissions and rank.
      x-required-permissions: [identity.roles.update]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceRolePermissionsRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Permissions replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`role_system_default` (system-default roles, Company Owner among them, cannot be changed by anyone)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/roles/{roleId}/permissions/grant:
    post:
      tags: [roles]
      summary: Grant a single permission to the role
      description: |
        Requires `identity.roles.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068). Conferring a permission the caller does not hold is rejected with `grant_exceeds_authority`.
        Changing what a role confers, re-levelling it or deleting it is acting on every ACTIVE member who holds it: the
        caller must strictly outrank each active holder (owners may act on owners) and must not hold the role
        themself (`insufficient_rank`, `self_modification_forbidden`); a rename acts on nobody. Every active holder's
        session ends the way an authority change on the member does: their old token answers 401 `stale_token`, the
        refresh succeeds with the new permissions and rank.
      x-required-permissions: [identity.roles.update]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePermissionRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Permission granted }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`role_system_default` (system-default roles cannot be changed by anyone)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/roles/{roleId}/permissions/revoke:
    post:
      tags: [roles]
      summary: Revoke a single permission from the role
      description: |
        Requires `identity.roles.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
        Changing what a role confers, re-levelling it or deleting it is acting on every ACTIVE member who holds it: the
        caller must strictly outrank each active holder (owners may act on owners) and must not hold the role
        themself (`insufficient_rank`, `self_modification_forbidden`); a rename acts on nobody. Every active holder's
        session ends the way an authority change on the member does: their old token answers 401 `stale_token`, the
        refresh succeeds with the new permissions and rank.
      x-required-permissions: [identity.roles.update]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/RoleId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RolePermissionRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Permission revoked }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '`role_system_default` (system-default roles cannot be changed by anyone)'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ===== PLATFORM =======================================================
  /api/v1/platform/tenants:
    get:
      tags: [platform]
      summary: List all tenants (operator dashboard)
      description: |
        Requires `platform.tenants.view` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Tenants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListAllTenantsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/tenants/{tenantId}:
    delete:
      tags: [platform]
      summary: Hard-delete a tenant (irrecoverable; Platform-only)
      description: |
        Bypasses the marked-for-deletion lifecycle. Tenants holding an
        active SuperAdmin role refuse with 422
        (`platform_tenant_undeletable`).

        The transition to `deleted`, its `tenant_deleted` outbox event and the row delete
        run in ONE transaction. A tenant that still has dependent records (members, roles,
        ...) is refused with 409 `tenant_has_dependents`: nothing is changed, the tenant
        keeps its status and no event is published. Remove or reassign the dependents first;
        there is no cascade.

        Requires `identity.tenants.delete` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
        The tenant comes from the path only: `X-Tenant-Id` is never applied here, and a
        value that differs from the path tenant is 400 `tenant_scope_conflict`. The
        operator is attributed on the outbox row (`act_operator_id`, reason `platform-route`).
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Tenant hard-deleted }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The tenant still has dependent records (`tenant_has_dependents`); nothing was changed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/platform/persons/{personId}:
    get:
      tags: [platform]
      summary: Get person by UUID (cross-tenant operator probe)
      description: |
        Requires `platform.users.view` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Person
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonDto' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: "`person_not_found`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/platform/persons/{personId}/memberships:
    get:
      tags: [platform]
      summary: List every Membership a Person holds across tenants
      description: |
        Requires `platform.users.view` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
      parameters: [{ $ref: '#/components/parameters/PersonId' }]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
