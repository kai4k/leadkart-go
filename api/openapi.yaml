        last_name:  { type: string }

    CreateUserResponse:
      type: object
      required: [person_id, membership_id, person_existed]
      properties:
        person_id:       { type: string, format: uuid }
        membership_id:   { type: string, format: uuid }
        person_existed:  { type: boolean }

    UpdateUserProfileRequest:
      type: object
      description: Full replace. Every field is required (an empty string clears it); a body that omits one is 400 `invalid_body` and nothing is changed.
      required: [designation, department, status_message]
      properties:
        designation:    { type: string }
