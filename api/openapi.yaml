  /api/v1/platform/stats:
    get:
      tags: [platform]
      summary: Operator dashboard counts (with optional time-window deltas)
      description: |
        Requires `platform.tenants.view` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
      parameters:
        - name: delta_window
          in: query
          required: false
          schema:
            type: string
            enum: ['', '24h', '7d', '30d']
            default: ''
