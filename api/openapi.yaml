      description: |
        A member's live permission overrides. Present on `GET /users/{userId}` only, and only for a caller who may change them. `granted` lists the grants not yet expired; `revoked` the names taken away. Re-sending a time-bound grant by name in `PATCH .../permission-overrides` keeps its expiry; the request has no way to extend it.
      required: [granted, revoked]
      properties:
        granted:
          type: array
          items: { $ref: '#/components/schemas/GrantedOverrideDto' }
