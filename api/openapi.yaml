          description: Stats
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformStatsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/impersonation/sessions:
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
      tags: [platform]
      summary: Open scoped impersonation session (AWS STS AssumeRole pattern; ADR 0045)
      description: |
        Returns a scoped JWT (`aud=leadkart-impersonation`,
        `is_platform=false`, `is_super_user=false`, `permissions=[tenant.admin]`)
        pinned to the target tenant. Frontend uses this token for the
        session lifetime (≤4h). The original operator's regular JWT is
        unaffected.

        Requires `platform.impersonation.manage` held by a platform-tenant operator; platform-tenant membership alone, and `platform.tenants.manage`, are refused with 403 `forbidden` (a session mints a `tenant.admin` token for the target tenant, so it has its own permission; `tenant.admin` never implies it).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `impersonation_invalid` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateImpersonationSessionRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Session opened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateImpersonationSessionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Target tenant not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [platform]
      summary: List impersonation sessions
      description: |
        Requires `platform.impersonation.manage` held by a platform-tenant operator; platform-tenant membership alone, and `platform.tenants.manage`, are refused with 403 `forbidden`.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Sessions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListImpersonationSessionsResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/impersonation/sessions/{sessionId}:
    delete:
      tags: [platform]
      summary: End an impersonation session (revoke scoped token)
      description: |
        Ends the session before its natural TTL. The scoped token issued
        by POST /api/v1/platform/impersonation/sessions is invalidated
        on the next request (security_stamp comparison via the
        impersonation-session resolver).

        Needs only the platform anchor (a slug-anchored, non-impersonation platform operator), not
        `platform.impersonation.manage`: only the session's own operator can end it (any other
        session id is the idempotent 204 no-op), so an operator who lost the permission can still
        close the session they opened. Principals that are not platform operators are refused with 403 `forbidden`.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Session ended }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ===== SEARCH =========================================================
  /api/v1/search:
    get:
      tags: [search]
      summary: Operator omni-search (parallel pg_trgm fanout)
      description: |
        Requires `platform.tenants.view` OR `platform.users.view` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
        Each category needs its own permission: `persons` needs `platform.users.view`, `tenants` needs `platform.tenants.view`.
        Without `include` the response carries the categories the caller is authorised for; naming a
        category the caller may not see is 403 `search_category_forbidden` (the message names the category).
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 5 }
        - name: include
          in: query
          required: false
          schema: { type: string, default: 'persons,tenants' }
          description: Comma-separated category list. Currently `persons`, `tenants`. Default is every category the caller is authorised for.
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Search results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResponse' }
        '400':
          description: Query too short or invalid include list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Missing both permissions (`forbidden`), or an explicitly requested category the caller lacks the permission for (`search_category_forbidden`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ===== PERMISSION REQUESTS (ADR 0055) =================================
  /api/v1/permission-requests:
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/XTenantId'
      tags: [permission-requests]
      summary: Submit a permission-elevation request
      description: |
        Caller (the requester) asks for a time-bound elevated permission.
        The named approver is the requester's current manager
        (`tenant_memberships.reports_to`); a requester with no manager is decided by anyone of
        Administrator rank or above who outranks them (ADR 0069). Requires
        `identity.meta.request_permission_elevation` (every seeded non-owner role holds it;
        `tenant.admin` implies it): without it the route is 403 `forbidden`. An impersonation session
        cannot submit (403 `impersonation_not_allowed`).
        At most one pending request per (membership, permission) tuple.
        `tenant.admin`, platform-reserved permissions and names outside the catalogue are not
        requestable: they are conferred by role only, and the request is refused with 422
        (`permission_not_requestable`). `identity.users.create` is requested only at the Administrator tier or
        above (403 `admin_tier_required` below it; owner ruling 2026-11-21).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `permission_request_invalid` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePermissionRequestRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Request submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePermissionRequestResponse' }
        '403':
          description: |
            `forbidden` (the caller lacks `identity.meta.request_permission_elevation`),
            `admin_tier_required` (`identity.users.create` requested below the Administrator tier),
            `impersonation_not_allowed`, or `X-Tenant-Id` selected a foreign tenant (`tenant_scope_not_supported`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Another pending request already exists for this (membership, permission) tuple
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    get:
      tags: [permission-requests]
      summary: List the caller's requests (?role=requester|approver)
      description: |
        Default `role=requester` returns the caller's own history (all states).
        `role=approver` returns the Pending requests the caller may DECIDE under the authority policy
        (ADR 0069): exactly those a deny by the caller would not refuse, so none of them answers 403
        for authority reasons. One call examines a bounded window of the tenant's pending requests
        (at most `page_size`, capped at 100); a page may therefore hold fewer items than `page_size`
        while `has_more` is true, and `next_cursor` continues after the last request examined.
        Keyset-paginated per ADR 0038.
        Every item of the approver queue carries `can_approve`: whether APPROVING it as asked would
        pass for the caller (the stored permission is requestable and within their authority, decided on
        the same stored facts approve uses). Deny is allowed for every listed item. A caller who can decide
        nothing (below the Admin tier and without `identity.roles.approve`) gets an empty page; a manager
        below the Admin tier sees only the requests of members who report to them.
      parameters:
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum: [requester, approver]
            default: requester
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Page of requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPermissionRequestsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/TenantScopeNotSupported' }

  /api/v1/permission-requests/{requestId}:
    get:
      tags: [permission-requests]
      summary: Get a single permission request
      description: |
        Returns the request to the requester and to anyone who may decide it (the same eligibility
        as deny, ADR 0069); every other caller, and a missing id, get the same 404 per ADR 0044
        enumeration-safety canon.
      parameters:
        - { $ref: '#/components/parameters/PermissionRequestId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: The request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PermissionRequestDto' }
        '403': { $ref: '#/components/responses/TenantScopeNotSupported' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/permission-requests/{requestId}/approve:
    post:
      tags: [permission-requests]
      summary: Approve a pending request (decided by the authority policy)
      description: |
        Transitions Pending → Approved AND confers exactly the STORED request's permission on the
        requester for the stored duration (single transaction under the tenant authority lock).
        Decided by the authority policy (ADR 0069), never by the body: the requester's manager who
        holds `identity.roles.approve` AND the permission; or anyone of Administrator rank or above who
        strictly outranks the requester (an Administrator may approve any requestable permission
        without holding it, user lifecycle (create, update, deactivate, reactivate, unlock) included, except
        role management and approval, changing a user's permissions, tenant settings, marketplace purchase, recording
        payments, payment and invoice access, tenant-wide visibility (read-all, users, roles, tenants, lead credits)
        and the right to request elevation, which the Administrator must hold); or a super user / exempt operator
        acting in ANOTHER tenant (in the platform tenant an operator follows rank like anyone else).
        Never an impersonation session and never the requester. The approved grant ends no later than the
        approver's own when the approver holds the permission only through a time-bound override. A caller who
        is not the requester and may not even deny the request (not its manager with `identity.roles.approve`,
        not senior enough) is answered 404, like a request that does not exist. When the requested permission is on the
        requester's REVOKED list the approval is an un-revoke and additionally needs the authority to change
        their overrides (act on the member and hold the permission itself): otherwise 403
        `grant_exceeds_authority`, the request stays pending.

        Check order: unknown request, or a caller who may not decide it (404) → authority over this permission (403, whatever the request's state) → state
        (409 `permission_request_not_pending`) → requestability (422 `permission_not_requestable`: a
        stored request whose permission is not requestable, for example one submitted before that rule
        existed, stays pending; the approver can deny it and the requester can cancel it) → requester
        still active (409 `permission_request_requester_inactive`; the request stays pending).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `permission_request_invalid` with `errors{<field>: ["invalid_characters"]}` for `decision_reason`, and nothing is written.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PermissionRequestId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovePermissionRequestRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Approved + grant created }
        '403':
          description: |
            `grant_exceeds_authority` (the approver does not hold the permission, an Administrator lacks a
            must-hold one, or the approval would lift a revoke without the Admin tier), `admin_tier_required`
            (a request for `identity.users.create` from a member below the Administrator tier: nobody approves
            it, the request stays pending and can be denied or cancelled), `self_modification_forbidden`
            (own request), `impersonation_not_allowed`, `forbidden` (no valid or no longer active acting member), or
            `tenant_scope_not_supported` (`X-Tenant-Id` selected a foreign tenant). Callers who may not decide the
            request at all get 404 `permission_request_not_found`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request is not in pending state (`permission_request_not_pending`), or the requester can no longer receive the grant (`permission_request_requester_inactive`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/permission-requests/{requestId}/deny:
    post:
      tags: [permission-requests]
      summary: Deny a pending request (decided by the authority policy)
      description: |
        Transitions Pending → Denied. `decision_reason` is REQUIRED on
        Deny per ADR 0055 audit canon. Same eligibility and check order as Approve, except that the
        denier need not hold the requested permission (nor `identity.roles.approve` as an Administrator).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `permission_request_invalid` with `errors{<field>: ["invalid_characters"]}` for `decision_reason`, and nothing is written.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PermissionRequestId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DenyPermissionRequestRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Denied }
        '403':
          description: |
            `self_modification_forbidden` (own request), `impersonation_not_allowed`, `forbidden`, or
            `tenant_scope_not_supported` (`X-Tenant-Id` selected a foreign tenant). Callers who may not decide the
            request get 404.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request is not in pending state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/permission-requests/{requestId}/cancel:
    post:
      tags: [permission-requests]
      summary: Cancel a pending request (requester only)
      description: |
        Withdraws a pending request. Caller MUST be the original
        requester; cross-caller cancel collapses to 404 per
        ADR 0044 enumeration-safety canon.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PermissionRequestId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Cancelled }
        '403': { $ref: '#/components/responses/TenantScopeNotSupported' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Request is not in pending state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ============================================================================
  # Platform bounded context (ADR 0059) — Slice 1
  # Verification pipeline + marketplace + lead credits.
  # ============================================================================

  /api/v1/platform/unverified-contacts:
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
      tags: [Platform]
      summary: Create a raw unverified contact
      description: Lead Agent registers a new prospect for verification.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUnverifiedContactRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUnverifiedContactResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }
    get:
      tags: [Platform]
      summary: List unverified contacts (Platform-only)
      description: Cursor-paginated list of contacts. Optional `status` filter.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [new, in_call, verified, rejected, busy] }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListUnverifiedContactsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/unverified-contacts/{id}/calls:
    post:
      tags: [Platform]
      summary: Log a verification call outcome
      description: |
        Records one call attempt against the contact. When `outcome=busy`,
        callback window fields are required; otherwise they MUST be omitted.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogVerificationCallRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogVerificationCallResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/unverified-contacts/{id}/verify:
    post:
      tags: [Platform]
      summary: Promote contact to a marketplace PlatformLead
      description: |
        Refuses with 409 (`contact_already_terminal`) when the contact
        is already in a terminal state (Verified or Rejected) — the
        handler will NOT emit a duplicate `LeadVerifiedV1` /
        fabricate a phantom PlatformLead. Per ADR 0059 review-pass
        H11.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/PathID'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Promoted; new PlatformLead ID returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyUnverifiedContactResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Contact already in a terminal state (Verified or Rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/unverified-contacts/{id}/reject:
    post:
      tags: [Platform]
      summary: Terminally reject an unverified contact
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectUnverifiedContactRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Rejected }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/marketplace/leads:
    get:
      tags: [Platform]
      summary: Browse marketplace leads (tenant-facing)
      description: |
        Cursor-paginated list of UNSOLD platform leads. All filters optional.
        `product_ranges` + `dosage_forms` are CSV (`?product_ranges=Cardiac,Diabetic`)
        and match ANY-overlap via GIN.
      parameters:
        - { name: state,            in: query, required: false, schema: { type: string } }
        - { name: city,             in: query, required: false, schema: { type: string } }
        - { name: district,         in: query, required: false, schema: { type: string } }
        - { name: pincode,          in: query, required: false, schema: { type: string } }
        - { name: business_type,    in: query, required: false, schema: { type: string, enum: [PCD, ThirdParty] } }
        - { name: medicine_system,  in: query, required: false, schema: { type: string, enum: [Allopathic, Ayurvedic] } }
        - { name: order_value,      in: query, required: false, schema: { type: string, enum: [Below5000, Upto25000, Upto50000, Above50000] } }
        - { name: buy_timeline,     in: query, required: false, schema: { type: string, enum: [WithinWeek, Within15Days, WithinMonth] } }
        - { name: has_drug_licence, in: query, required: false, schema: { type: boolean } }
        - { name: has_gst,          in: query, required: false, schema: { type: boolean } }
        - { name: gst_verified,     in: query, required: false, schema: { type: boolean } }
        - { name: product_ranges,   in: query, required: false, schema: { type: string }, description: 'Comma-separated' }
        - { name: dosage_forms,     in: query, required: false, schema: { type: string }, description: 'Comma-separated' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrowseMarketplaceResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/marketplace/leads/{id}/purchase:
    post:
      tags: [Platform]
      summary: Purchase a marketplace lead with credits
      description: |
        Debits 1 credit from the caller's tenant lead-credit balance + transfers
        the lead to the tenant's CRM (via the LeadPurchasedV1 event consumed by CRM).
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/PathID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PurchaseLeadRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Purchased
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseLeadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeNotSupported' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead already sold OR credit-row concurrency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/lead-credits/topup:
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
      tags: [Platform]
      summary: Top up a tenant's lead-credit balance (Platform-only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TopupLeadCreditsRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Topped up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TopupLeadCreditsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/lead-credits/balance:
    get:
      tags: [Platform]
      summary: Get current tenant's lead-credit balance
      parameters:
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadCreditBalanceResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/inventory/products:
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/XTenantId'
      tags: [inventory]
      summary: Create a Product
      description: |
        Requires `inventory.catalog.manage`. SKU is canonicalised
        upper-case + trimmed before per-tenant uniqueness check. 409 on
        SKU collision. 422 on field-validation failure.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Product created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateProductResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: SKU already exists in this tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

    get:
      tags: [inventory]
      summary: List Products (cursor-paginated)
      description: |
        Requires `inventory.catalog.read` OR `inventory.catalog.manage`.
        Returns the live (non-deleted) products for the caller's tenant
        ordered (created_at, id) DESC. Filters narrow the result set.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: active
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
          description: When 'true', restricts to is_active products.
        - name: dosage_form
          in: query
          required: false
          schema: { type: string }
        - name: manufacturer
          in: query
          required: false
          schema: { type: string }
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: pg_trgm fuzzy match on (sku || name) per ADR 0040.
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Page of products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListProductsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/inventory/products/{productId}:
    get:
      tags: [inventory]
      summary: Get a Product by ID
      description: |
        Requires `inventory.catalog.read`. Cross-tenant access surfaces
        as 404 per ADR 0044 enumeration-safety.
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Product view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDto' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

    patch:
      tags: [inventory]
      summary: Update a Product
      description: |
        Requires `inventory.catalog.manage`. Supplied-key partial update —
        only fields present in the JSON body are applied (omitted fields
        retain their prior value). JSON `null` is NOT distinguishable from
        omission on the wire, so clearing a field is not supported; this
        deliberately differs from RFC 7396 merge-patch semantics. 422 on
        invariant failure (out-of-range GST bps, oversized name, etc).
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/ProductId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Updated }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Product is deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

    delete:
      tags: [inventory]
      summary: Soft-delete a Product
      description: |
        Requires `inventory.catalog.manage`. Idempotent — repeat calls
        return 204. REJECTED with 409 `product_has_live_stock` if any
        live batch with quantity_on_hand > 0 exists.
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Deleted (or already deleted) }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Product has live batches with non-zero stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/inventory/products/{productId}/batches:
    post:
      tags: [inventory]
      summary: Add a Batch to a Product
      description: |
        Requires `inventory.stock.manage`. The parent product MUST exist
        in the caller's tenant scope (cross-tenant or missing → 404).
        batch_number is unique per product on live rows.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/ProductId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddBatchRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Batch added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AddBatchResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: batch_number already exists for this product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

    get:
      tags: [inventory]
      summary: List Batches for a Product (cursor-paginated, FEFO-ordered)
      description: |
        Requires `inventory.stock.read` OR `inventory.stock.manage`.
        Returns live batches ordered by expiry_date DESC. Expired batches
        excluded by default (pass `include_expired=true` to include).
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: include_expired
          in: query
          required: false
          schema: { type: string, enum: ['true', 'false'] }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Page of batches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListBatchesResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/inventory/products/{productId}/fefo-batches:
    get:
      tags: [inventory]
      summary: List FEFO-ordered live batches for a Product
      description: |
        Requires `inventory.stock.read` OR `inventory.stock.manage`.
        Returns LIVE, in-stock, not-yet-expired batches for the
        supplied product, ordered (expiry_date ASC, id ASC) per BRD §6.5
        First-Expired-First-Out canon. No pagination — feeds the
        dispatch picker which needs the full eligible set to compute
        multi-batch allocations against a single order quantity.
      parameters:
        - { $ref: '#/components/parameters/ProductId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: FEFO-ordered batch list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FefoBatchesResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/inventory/batches/{batchId}:
    get:
      tags: [inventory]
      summary: Get a Batch by ID
      description: |
        Requires `inventory.stock.read` OR `inventory.stock.manage`.
        Cross-tenant access surfaces as 404 per ADR 0044.
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Batch view
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchDto' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/inventory/batches/{batchId}/movements:
    post:
      tags: [inventory]
      summary: Log a Stock Movement
      description: |
        Requires `inventory.stock.manage`. Persists the movement + bumps
        the batch's quantity_on_hand atomically (single tx). Idempotency
        via `X-Command-Id` per ADR 0031.

        Quantity is the POSITIVE magnitude — direction is implicit in
        Type (Outbound subtracts). Adjustment writes the positive
        magnitude in slice 1; future `direction` field for up/down.

        Rejections (409): insufficient_stock (Outbound > on-hand),
        batch_expired (Inbound on expired batch), conflict (concurrent
        modification after retry cap).

        Only `inbound`, `outbound` and `adjustment` are accepted here.
        `reservation` and `release` belong to the order saga; asking for
        them (or any other type) is `422 invalid_movement_type`, nothing
        written.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/BatchId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogMovementRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Movement logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogMovementResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Insufficient stock / batch expired / concurrency conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`invalid_movement_type` — type is not inbound, outbound or adjustment (`reservation` and `release` are not public); otherwise validation (`validation_failed`)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

    get:
      tags: [inventory]
      summary: List Stock Movements for a Batch (cursor-paginated)
      description: |
        Requires `inventory.stock.read` OR `inventory.stock.manage`.
        Append-only ledger ordered (occurred_at, id) DESC. Optional
        `type` filter narrows to one movement type.
      parameters:
        - { $ref: '#/components/parameters/BatchId' }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [inbound, outbound, adjustment, reservation, release]
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Page of movements
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListMovementsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
  # ===== CRM ============================================================
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/crm/leads:
    get:
      tags: [crm]
      summary: List CRM leads (cursor-paginated, filterable)
      description: |
        Returns a cursor-paginated page of CRM leads in the caller's tenant.

        Filters (all optional): stage, temperature, assignee, city, pincode,
        business_type, medicine_system, name (pg_trgm partial match),
        product_range (repeatable — AND semantics on text[] GIN), dosage_form
        (repeatable).

        Callers WITHOUT `crm.leads.read_all` see only leads assigned to
        themselves; callers WITH it see the full tenant set per ADR 0060.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: stage
          in: query
          required: false
          schema: { type: string, enum: [new, contacted, interested, negotiation, converted, lost] }
        - name: temperature
          in: query
          required: false
          schema: { type: string, enum: [hot, warm, cold, dead] }
        - name: assignee
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: city
          in: query
          required: false
          schema: { type: string }
        - name: pincode
          in: query
          required: false
          schema: { type: string }
        - name: business_type
          in: query
          required: false
          schema: { type: string, enum: [PCD, ThirdParty] }
        - name: medicine_system
          in: query
          required: false
          schema: { type: string, enum: [Allopathic, Ayurvedic] }
        - name: name
          in: query
          required: false
          schema: { type: string }
          description: 'pg_trgm partial-match on contact_name'
        - name: product_range
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - name: dosage_form
          in: query
          required: false
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Cursor-paginated lead page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListLeadsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/crm/leads/{leadId}:
    get:
      tags: [crm]
      summary: Get one CRM lead by ID
      description: |
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: The lead
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrmLeadDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/crm/leads/{leadId}/assign:
    post:
      tags: [crm]
      summary: Assign or reassign a lead
      description: |
        Sets the lead's current assignee. Atomic with an append to the
        AssignmentHistory audit table. Emits `crm.lead_assigned.v1`.
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
        The response echoes the canonical (lower-case, hyphenated) `assignee_membership_id`.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignLeadRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignLeadResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead is in a terminal stage (converted / lost)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`reason_too_long` — over 1000 bytes", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/crm/leads/{leadId}/stage:
    post:
      tags: [crm]
      summary: Advance lead through the stage state machine
      description: |
        Non-terminal transitions only: New → Contacted → Interested →
        Negotiation. Use `/convert` or `/lose` for terminal transitions.
        Emits `crm.lead_stage_changed.v1`.
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStageRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Stage updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead is in a terminal stage OR transition is not allowed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/crm/leads/{leadId}/temperature:
    post:
      tags: [crm]
      summary: Change the lead's qualitative temperature axis
      description: |
        Independent of stage — Hot/Warm/Cold/Dead transition at any
        non-terminal stage. Emits `crm.lead_temperature_changed.v1`.
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeTemperatureRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Temperature updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead is in a terminal stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/crm/leads/{leadId}/calls:
    post:
      tags: [crm]
      summary: Log a call against a lead
      description: |
        Creates a CallLog row + emits `crm.call_logged.v1`. Refused on
        terminal leads (converted / lost).
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LogCallRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Call logged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogCallResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead is in a terminal stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`notes_too_long` — over 4000 bytes", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/crm/leads/{leadId}/convert:
    post:
      tags: [crm]
      summary: Terminal-convert a lead (won)
      description: |
        Sets the lead to `converted`. Emits `crm.lead_converted.v1` —
        this is the future Orders module's create-trigger per ADR 0060.
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Converted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead is already in a terminal stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  # ----- Tasks module (BRD §6.8) ---------------------------------------------

  /api/v1/tasks/work-items:
    post:
      tags: [tasks]
      summary: Create a manual work item
      description: |
        Creates a new manual task in the caller's tenant. The caller's
        membership becomes the AssignedByMembershipID; the request body's
        `assigned_to_membership_id` must reference an active membership in
        the same tenant (otherwise 422 `assignee_inactive`). Emits
        `tasks.work_item_created.v1`.
      parameters:
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkItemRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Work item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateWorkItemResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TenantNotActive' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [tasks]
      summary: List work items (cursor-paginated, filterable)
      description: |
        Cursor-paginated list. Callers WITHOUT `tasks.work_items.read_all`
        see only their own tasks (a `?assignee=` that points elsewhere
        returns 403).
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [pending, in_progress, completed, overdue, cancelled] }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [manual, callback_reminder, reorder_reminder, follow_up, custom] }
        - name: priority
          in: query
          required: false
          schema: { type: string, enum: [low, medium, high, urgent] }
        - name: assignee
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: batch_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: due_before
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: due_after
          in: query
          required: false
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Cursor-paginated work-item page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListWorkItemsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/tasks/work-items/dashboard:
    get:
      tags: [tasks]
      summary: Dashboard counts (today / upcoming / overdue / completed-today / total-pending)
      description: |
        Returns the BRD §6.8 dashboard tallies. By default scoped to the
        caller's own tasks; pass `?include_team=true` to expand to the
        actor's subordinate scope via the hierarchy traversal (requires
        `tasks.work_items.read_all`).
      parameters:
        - name: include_team
          in: query
          required: false
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Dashboard counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/tasks/work-items/{workItemId}:
    get:
      tags: [tasks]
      summary: Get a single work item
      parameters:
        - { $ref: '#/components/parameters/WorkItemId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItemDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/tasks/work-items/{workItemId}/start:
    post:
      tags: [tasks]
      summary: Flip work item to in_progress
      parameters:
        - { $ref: '#/components/parameters/WorkItemId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Started }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Work item is in a terminal / overdue state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/tasks/work-items/{workItemId}/complete:
    post:
      tags: [tasks]
      summary: Terminal-complete a work item
      parameters:
        - { $ref: '#/components/parameters/WorkItemId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Completed }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cannot complete a cancelled task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/tasks/work-items/{workItemId}/cancel:
    post:
      tags: [tasks]
      summary: Terminal-cancel a work item (with required reason)
      parameters:
        - { $ref: '#/components/parameters/WorkItemId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelWorkItemRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cannot cancel a completed task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Reason missing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/tasks/work-items/{workItemId}/reassign:
    post:
      tags: [tasks]
      summary: Reassign a work item (hierarchy-gated per BRD §6.7)
      description: |
        Moves the task to a new membership. The caller must hold
        `tasks.work_items.reassign` AND the new assignee must be in the
        caller's subordinate scope (or be the caller themselves). 403
        `reassign_forbidden` otherwise.
      parameters:
        - { $ref: '#/components/parameters/WorkItemId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReassignWorkItemRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Reassigned }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cannot reassign a terminal task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: New assignee not active in tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/dispatch/consignment-notes:
    post:
      tags: [dispatch]
      summary: Create a consignment-note slot (manual)
      description: |
        Creates a pending ConsignmentNote for an order. Normally the
        OrderPacked subscriber mints the slot automatically; this route
        covers operator-driven creation. Idempotent on (tenant, order):
        a pre-existing note returns 200 with `already_existed: true`.
      parameters:
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConsignmentNoteRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Consignment note created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateConsignmentNoteResponse' }
        '200':
          description: Consignment note already existed for this order (idempotent)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateConsignmentNoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TenantNotActive' }
        '422': { description: "`carrier_name_required`, `carrier_name_too_long` (over 200 characters), `box_count_invalid`, `weight_grams_invalid`, `expected_delivery_not_in_future`; otherwise `invalid_body`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [dispatch]
      summary: Get the consignment note attached to an order
      description: Returns the single note for the given `order_id`, or 404.
      parameters:
        - name: order_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Consignment note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsignmentNoteDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/dispatch/consignment-notes/{consignmentNoteId}:
    get:
      tags: [dispatch]
      summary: Get a single consignment note
      parameters:
        - { $ref: '#/components/parameters/ConsignmentNoteId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Consignment note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsignmentNoteDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/dispatch/consignment-notes/{consignmentNoteId}/dispatch:
    post:
      tags: [dispatch]
      summary: Mark dispatched (pending → dispatched, captures docket number)
      parameters:
        - { $ref: '#/components/parameters/ConsignmentNoteId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkDispatchedRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Dispatched }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`docket_number_too_long` — over 100 characters; otherwise `invalid_body`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/dispatch/consignment-notes/{consignmentNoteId}/in-transit:
    post:
      tags: [dispatch]
      summary: Mark in-transit (dispatched → in_transit)
      parameters:
        - { $ref: '#/components/parameters/ConsignmentNoteId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: In transit }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/dispatch/consignment-notes/{consignmentNoteId}/delivered:
    post:
      tags: [dispatch]
      summary: Mark delivered (terminal-success; triggers the Orders saga)
      parameters:
        - { $ref: '#/components/parameters/ConsignmentNoteId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Delivered }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/dispatch/consignment-notes/{consignmentNoteId}/failed:
    post:
      tags: [dispatch]
      summary: Mark failed (terminal-failure, with required reason)
      parameters:
        - { $ref: '#/components/parameters/ConsignmentNoteId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkFailedRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Failed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid status transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`reason_too_long` — over 1000 characters; otherwise `invalid_body`", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/quotations:
    post:
      tags: [orders]
      summary: Create a draft quotation
      description: |
        `customer_lead_id` and every `items[].product_id` must be UUIDs (any RFC 4122
        spelling; stored and echoed in canonical form). A malformed one is 400
        `invalid_body`; an absent one is the domain's 422 validation error.
      parameters:
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateQuotationRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Quotation created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateQuotationResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TenantNotActive' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/quotations/{quotationId}:
    get:
      tags: [orders]
      summary: Get a quotation
      parameters:
        - { $ref: '#/components/parameters/QuotationId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Quotation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuotationDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/quotations/{quotationId}/revise:
    post:
      tags: [orders]
      summary: Append a quotation revision
      description: |
        Every `items[].product_id` must be a UUID (any RFC 4122 spelling, stored in
        canonical form); a malformed one is 400 `invalid_body`.
      parameters:
        - { $ref: '#/components/parameters/QuotationId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviseQuotationRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Revised }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Quotation is terminal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/quotations/{quotationId}/approve:
    post:
      tags: [orders]
      summary: Approve a quotation (seeds the Order)
      parameters:
        - { $ref: '#/components/parameters/QuotationId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Approved; Order created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApproveQuotationResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Quotation already rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/quotations/{quotationId}/reject:
    post:
      tags: [orders]
      summary: Reject a quotation (with reason)
      parameters:
        - { $ref: '#/components/parameters/QuotationId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectQuotationRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Rejected }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Quotation already approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/orders/orders/{orderId}:
    get:
      tags: [orders]
      summary: Get an order
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrderDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/orders/{orderId}/token-payment:
    post:
      tags: [orders]
      summary: Record the token payment + advance to token_paid
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordTokenPaymentRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Recorded }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: "`token_payment_already_recorded` — the order is already `token_paid`, so its token payment was recorded; nothing is written. `invalid_state_transition` — the order is in any other state (a later one, or cancelled). `payment_duplicate_reference` — the external reference was already recorded."
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`external_reference_too_long` (over 100 characters), `notes_too_long` (over 2000); otherwise validation (`validation_failed`). Nothing is written.", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/orders/{orderId}/confirm:
    post:
      tags: [orders]
      summary: Confirm an order (token_paid → confirmed)
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Confirmed }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/orders/orders/{orderId}/pack:
    post:
      tags: [orders]
      summary: Pack an order (confirmed → packed)
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PackOrderRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Packed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { description: "Refused before the order changes state, with the rules the consignment note enforces: `carrier_name_required`, `carrier_name_too_long` (over 200 characters), `box_count_invalid` (not above 0), `weight_grams_invalid` (not above 0), `expected_delivery_not_in_future`. Otherwise validation (`validation_failed`).", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/orders/orders/{orderId}/invoice:
    get:
      tags: [orders]
      summary: Get the order's invoice
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDto' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [orders]
      summary: Invoice an order (packed → invoiced, gapless number)
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Invoiced
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceOrderResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid transition or invoice already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/orders/{orderId}/cancel:
    post:
      tags: [orders]
      summary: Cancel an order (with reason)
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelOrderRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Order already terminal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { description: "`reason_too_long` — over 1000 characters; otherwise validation (`validation_failed`)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/orders/orders/{orderId}/complete:
    post:
      tags: [orders]
      summary: Complete an order (delivered → complete)
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Completed }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Invalid state transition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500': { $ref: '#/components/responses/InternalServerError' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/orders/orders/{orderId}/payments:
    get:
      tags: [orders]
      summary: List an order's payments
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Payments
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListPaymentsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [orders]
      summary: Record a payment receipt (balance / full / refund)
      description: |
        Kinds `full` and `refund` only. `kind: token` is refused with
        `422 token_payment_route_required`: a token receipt must advance the
        order, so it goes through `POST /orders/orders/{orderId}/token-payment`.
        Other payment rules (part payments, an amount over the balance, a state
        check) are not enforced yet: they wait for an owner decision.
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordPaymentRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordPaymentResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Duplicate external reference
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { description: "`token_payment_route_required` — kind is `token`: use POST /orders/orders/{orderId}/token-payment; `external_reference_too_long` (over 100 characters), `notes_too_long` (over 2000); otherwise validation (`validation_failed`)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/orders/orders/{orderId}/credit-notes:
    post:
      tags: [orders]
      summary: Mint an operator credit note against the order's invoice
      description: |
        Post-delivery return (BRD §A-014). Mints a credit_note (partial amount
        allowed) against the order's invoice with a gapless number. Requires
        `orders.orders.manage`. 404 if the order has no invoice.

        The notes on one invoice (credit notes and the cancellation note
        together) may never add up to more than the invoice's grand total:
        a note that would pass it is `422 credit_note_exceeds_invoice` and
        nothing is written. The check counts the notes already issued and runs
        under a lock, so two concurrent notes cannot both fit.
      parameters:
        - { $ref: '#/components/parameters/OrderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MintCreditNoteRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Credit note minted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MintCreditNoteResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TenantNotActive' }
        '422': { description: "`credit_note_exceeds_invoice` — the notes on the invoice, this one included, would pass its grand total; `reason_too_long` — over 1000 characters; `credit_note_invalid` — a field is invalid", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/crm/leads/{leadId}/lose:
    post:
      tags: [crm]
      summary: Terminal-lose a lead (with required reason)
      description: |
        Sets the lead to `lost`. `reason` is REQUIRED (audit doctrine).
        Emits `crm.lead_lost.v1`.
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoseLeadRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Lost }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Lead is already in a terminal stage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "`reason_required` — reason missing; `reason_too_long` — over 1000 bytes (it used to be reported as `invalid_stage`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/crm/leads/{leadId}/reminders:
    post:
      tags: [crm]
      summary: Create a manual reminder against a lead
      description: |
        Creates a `manual` Reminder owned by the supplied assignee.
        `callback` + `mature_lead` reminders are auto-created by the
        CallLogged subscriber (BRD §4.5) + the mature-lead daily scan
        (BRD §4.7) respectively; the HTTP surface only mints manual ones.
        Emits `crm.reminder_created.v1`.
        Single-lead access follows the list rule: a caller without `crm.leads.read_all`
        (and without operator reach) reaches only a lead assigned to their own
        membership; any other lead answers 404 `lead_not_found`, exactly like a lead that
        does not exist.
      parameters:
        - { $ref: '#/components/parameters/LeadId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateReminderRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '201':
          description: Reminder created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateReminderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/TenantNotActive' }
        '422':
          description: "`invalid_due_at` — due_at missing or invalid; `notes_too_long` — notes over 2000 bytes (it used to be reported as `invalid_due_at`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/crm/reminders:
    get:
      tags: [crm]
      summary: List pending reminders (cursor-paginated)
      description: |
        Returns a cursor-paginated page of pending reminders in the
        caller's tenant, sorted by `due_at` ASC (overdue first,
        upcoming after). Filters: `type`, `assignee`, `lead_id`.

        Callers WITHOUT `crm.leads.read_all` see only their own
        assignee bucket per ADR 0060; probing another assignee is 403
        `forbidden`. The route honours `X-Tenant-Id` (reads only), so it can
        also answer the scope errors below.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: type
          in: query
          required: false
          schema: { type: string, enum: [callback, mature_lead, manual] }
        - name: assignee
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: lead_id
          in: query
          required: false
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Cursor-paginated reminder page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListRemindersResponse' }
        '400': { $ref: '#/components/responses/TenantScopeInvalid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/crm/reminders/{reminderId}/sent:
    post:
      tags: [crm]
      summary: Mark a pending reminder as sent (terminal)
      description: |
        Flips state to `sent`. Refused on already-terminal reminders.
        Emits `crm.reminder_marked_sent.v1`.
        A caller without `crm.leads.read_all` (and without operator reach) reaches only a
        reminder assigned to their own membership; any other reminder answers 404
        `reminder_not_found`.
      parameters:
        - { $ref: '#/components/parameters/ReminderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Marked sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Reminder is already in a terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /api/v1/crm/reminders/{reminderId}/cancel:
    post:
      tags: [crm]
      summary: Cancel a pending reminder (terminal; reason required)
      description: |
        Flips state to `cancelled`. `reason` is REQUIRED (audit
        doctrine). Refused on already-terminal reminders. Emits
        `crm.reminder_cancelled.v1`.
        A caller without `crm.leads.read_all` (and without operator reach) reaches only a
        reminder assigned to their own membership; any other reminder answers 404
        `reminder_not_found`.
      parameters:
        - { $ref: '#/components/parameters/ReminderId' }
        - { $ref: '#/components/parameters/XCommandId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelReminderRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Cancelled }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/TenantScopeReadOnly' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Reminder is already in a terminal state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: "`reason_required` — reason missing; `reason_too_long` — over 1000 bytes (it used to be reported as `reason_required`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: List the caller's notification inbox (cursor-paginated)
      description: |
        Returns the authenticated membership's own notifications, newest first.
        Optional `?state=` and `?category=` filters. Recipient scoping is
        enforced server-side — a caller only ever sees their own inbox.
      parameters:
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/PageSize' }
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [unread, read, dismissed] }
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [lead_assigned, lead_converted, order_confirmed, order_delivered, work_item_assigned, work_item_overdue, stock_expiring, stock_below_reorder, reminder]
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '200':
          description: Cursor-paginated notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListNotificationsResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Unread notification count for the caller (badge)
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '200':
          description: Unread count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCountResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark every unread notification read
      parameters:
        - { $ref: '#/components/parameters/XCommandId' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '200':
          description: Count of notifications flipped to read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarkAllReadResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /api/v1/notifications/{notificationId}/read:
    post:
      tags: [notifications]
      summary: Mark one notification read
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
        - { $ref: '#/components/parameters/XCommandId' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '204': { description: Marked read }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Cannot mark a dismissed notification read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/notifications/{notificationId}/dismiss:
    post:
      tags: [notifications]
      summary: Dismiss one notification
      parameters:
        - { $ref: '#/components/parameters/NotificationId' }
        - { $ref: '#/components/parameters/XCommandId' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '403': { $ref: '#/components/responses/PasswordChangeRequired' }
        '204': { description: Dismissed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Conflict with the current state of the resource (see the `error` code)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT access token from POST /api/v1/auth/login.
        Audience `leadkart-api` for regular tokens or `leadkart-impersonation`
        for scoped impersonation tokens.

  parameters:
    XCommandId:
      name: X-Command-Id
      in: header
      required: false
      description: |
        Per-caller idempotency key (UUID). When supplied on an authenticated, state-changing
        request (POST / PUT / PATCH / DELETE) the server replays the original 2xx response
        within the retention window (24h, Stripe canon). The scope is the verified
        tenant + person + membership + impersonation session + acted-on tenant
        (`X-Tenant-Id`, operators only) + method and path, so the same key on another
        route, tenant or session is a different command. Only 2xx answers are stored.

        The header is IGNORED (not rejected, nothing stored or replayed) on every
        operation under `/api/v1/auth/` (login and refresh answers carry plaintext refresh
        tokens and their request bodies carry passwords), on anonymous requests, and on
        safe methods (GET, HEAD, OPTIONS, TRACE); it is therefore not declared on those
        operations. Per ADR 0031 and ADR 0068 D11.
      schema: { type: string, format: uuid, minLength: 36, maxLength: 36 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: Opaque base64-encoded keyset cursor. Omit for first page.
    PageSize:
      name: page_size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: |
        Operator tenant scope (ADR 0039, ADR 0068 D7). Honoured ONLY for
        slug-anchored, non-impersonation platform operators whose token and
        security stamp are valid AND who may select a foreign tenant: a super
        user, or an operator holding `platform.tenants.view`. The request then
        runs in that tenant (RLS `app.tenant_id`) and permissions are evaluated
        there via the `platform.*` equivalents. A platform-tenant member without
        that authority who names a foreign tenant gets 403
        `tenant_scope_forbidden`, decided before any tenant lookup and identical
        for existing, unknown and suspended tenants. The header is IGNORED (no
        validation, no lookup, no audit) for every other caller (tenant members,
        impersonation tokens) and on routes where it cannot apply: all
        `/api/v1/auth/*` routes, `/api/v1/notifications*` (the caller's own
        inbox), `/api/v1/platform/*` routes other than the lead-credit balance
        read, `POST /api/v1/tenants`, `GET /api/v1/tenants`, the by-slug lookup
        and `GET /api/v1/search`. Without it, operators act in their own tenant.

        Writes are read-only under a foreign header by default: a non-read
        request is 403 `tenant_scope_read_only` unless the route is one of the
        identity writes the operator scope tree uses (users, roles, role
        permissions, permission overrides, manager changes, anonymise) or a
        `/api/v1/tenants/{tenantId}/...` path-tenant route. crm, orders, tasks,
        dispatch and inventory mutations are never accepted under a foreign
        header.

        A scoped request, or a write to another tenant through the URL alone, is
        attributed durably: its outbox and audit rows carry `act_operator_id`
        (the operator) with reason `tenant-via-header` (header) or
        `tenant-via-path` (URL path only). Platform-gated routes that carry
        neither (header-less lifecycle calls, hard delete, platform person
        operations, platform-module writes) use reason `platform-route`.

        On a path-tenant route (`/api/v1/tenants/{tenantId}/...`, lifecycle,
        hard delete) a header equal to the path tenant selects nothing: no scope
        authority is needed and no tenant is looked up, so the answer is the
        route's own permission gate whether or not the header is sent.

        Errors for an honoured header: 400 `invalid_tenant_scope` (not a UUID,
        or supplied more than once), 400 `tenant_scope_conflict` (differs from
        the path tenant on `/api/v1/tenants/{tenantId}` routes, where the path
        wins; also on `DELETE /api/v1/platform/tenants/{tenantId}`), 403
        `tenant_scope_forbidden` (caller lacks scope authority), 403
        `tenant_scope_read_only` (see above), 404 `tenant_scope_not_found`
        (unknown or deleted tenant), 409 `tenant_not_active` (a write into a
        suspended or pending-deletion tenant on a non-path route; reads and
        path-tenant routes are allowed), 403 `tenant_scope_not_supported`
        (routes that act on the caller's own tenant only: permission requests
        and the marketplace lead purchase).
      schema: { type: string, format: uuid }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoleId:
      name: roleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PersonId:
      name: personId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PermissionRequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PathID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Generic resource path-parameter (Platform module routes).
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    WorkItemId:
      name: workItemId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ReminderId:
      name: reminderId
      in: path
      required: true
      schema: { type: string, format: uuid }

    NotificationId:
      name: notificationId
      in: path
      required: true
      schema: { type: string, format: uuid }

    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BatchId:
      name: batchId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ConsignmentNoteId:
      name: consignmentNoteId
      in: path
      required: true
      schema: { type: string, format: uuid }
    QuotationId:
      name: quotationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Malformed request (invalid body, bad param shape)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource not found (per ADR 0044, enumeration-safe — may also mean "exists but no access")
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Unprocessable:
      description: Validation failure (RFC 9457 with field-level errors map)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Forbidden:
      description: |
        Authenticated but missing the required permission. Every authenticated operation
        outside the forced-change allowlist can also answer `403` with
        `error: password_change_required` while the token carries `must_change_password`
        (see the API description; no `WWW-Authenticate`, do not refresh), and an
        impersonation token answers `403 impersonation_not_allowed` on the routes it may
        not reach (platform plane, tenant lifecycle, search, anonymise, self-service).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PasswordChangeRequired:
      description: |
        `error: password_change_required`. The token carries `must_change_password`: the
        person holds a temporary credential and must change it first. Only
        `POST /api/v1/auth/change-password` and `GET /api/v1/auth/me/capabilities` are
        reachable. The response carries no `WWW-Authenticate` (this is not a session
        problem: do not refresh). Applies to every authenticated operation outside that
        allowlist; operations that document a more specific 403 carry it in that
        response's description.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    SessionRefused:
      description: |
        `error: impersonation_not_allowed` (the token is an impersonation token, and this
        account route is never reachable with one) or `error: password_change_required`
        (the token carries `must_change_password`). Neither carries `WWW-Authenticate`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ImpersonationNotAllowed:
      description: |
        `error: impersonation_not_allowed`. The token is an impersonation token; changing
        a password is never reachable with one. (This operation is on the forced-change
        allowlist, so `password_change_required` does not apply.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TenantScopeNotSupported:
      description: |
        The route does not support the `X-Tenant-Id` operator scope (it acts on the
        caller's own tenant only) and the header selected a different tenant
        (`tenant_scope_not_supported`, ADR 0039).
        (Like every authenticated operation, also `403 password_change_required` while the token carries `must_change_password`.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    AuthorityForbidden:
      description: |
        Forbidden. `error` is one of: `forbidden` (the caller lacks the route's permission in
        the effective tenant, or is not a valid actor), `tenant_scope_forbidden` (see
        TenantScopeForbidden), `self_modification_forbidden` (the caller targeted themself),
        `insufficient_rank` (the caller does not strictly outrank the target member or role,
        ADR 0069), `grant_exceeds_authority` (the change confers or removes a permission the
        caller does not hold, or `tenant.admin` as a non-owner), `admin_tier_required` (the change would give
        `identity.users.create` to a role or a member below the Administrator tier: a role below the tier cannot
        contain it, it cannot be an override of a member below the tier, and it cannot be requested or approved
        below the tier; owner ruling 2026-11-21), `ownership_authority_required`
        (a platform operator acting under `X-Tenant-Id` tried to change who OWNS the tenant:
        assign or revoke Company Owner, confer or remove `tenant.admin` by role or override, or
        deactivate or reactivate an owner, without `platform.tenants.ownership`; super users are unaffected).
        Editing a role acts on its active holders (`insufficient_rank`, `self_modification_forbidden`); lifting a
        member's explicit revoke (an overrides change, or approving a request for a revoked name) needs the Admin
        tier or above (`grant_exceeds_authority`).
        (Like every authenticated operation, also `403 password_change_required` while the token carries `must_change_password`.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TenantScopeForbidden:
      description: |
        Forbidden. `error` is `forbidden` (the caller lacks the route's permission in the
        effective tenant) or `tenant_scope_forbidden` (`X-Tenant-Id` names another tenant
        and the caller is neither a super user nor a platform operator holding
        `platform.tenants.view`). On path-tenant routes (`/api/v1/tenants/{tenantId}/...`,
        the lifecycle routes) a header equal to the path tenant is not a scope request, so
        `tenant_scope_forbidden` is never returned there: the route's own permission
        decides, with `forbidden`. `tenant_scope_forbidden` is decided before any tenant
        lookup and is identical for existing, unknown and suspended tenants, so it cannot
        be used to probe which tenants exist.
        (Like every authenticated operation, also `403 password_change_required` while the token carries `must_change_password`.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TenantScopeReadOnly:
      description: |
        Forbidden. As `TenantScopeForbidden` (`forbidden`, `tenant_scope_forbidden`), plus
        `tenant_scope_read_only`: the request is not a read, `X-Tenant-Id` names another
        tenant, and this route is not one of the identity writes operators may perform
        under scope. Writes to crm, orders, tasks, dispatch and inventory are never
        accepted under a foreign `X-Tenant-Id`; call them as a member of the tenant.
        (Like every authenticated operation, also `403 password_change_required` while the token carries `must_change_password`.)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TenantScopeInvalid:
      description: |
        `X-Tenant-Id` is malformed or supplied more than once (`invalid_tenant_scope`), or
        differs from the tenant in the URL (`tenant_scope_conflict`). Every platform-tenant
        member (is_platform with the platform slug anchor, not an impersonation token) can
        see it, whether or not they hold scope authority; every other caller has the header
        ignored. The same 400 also covers an invalid list filter or cursor on routes that
        take them.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TenantNotActive:
      description: |
        The tenant selected by `X-Tenant-Id` is suspended or pending deletion, so it can be
        read and its lifecycle managed but not written otherwise (`tenant_not_active`).
        Routes that carry the tenant in the path (`/api/v1/tenants/{tenantId}/...`) are
        exempt: the path is authoritative there, with or without the header.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    TooManyRequests:
      description: |
        Rate limit exceeded; `Retry-After` carries the whole seconds to wait (rounded up).
        EVERY operation can answer this: a global per-client limiter (10 requests/s, burst 60)
        runs in front of the whole API, and its key map is capped (a new client is refused while
        the cap is full). The bucket is the client address (the end client the BFF forwards in
        `X-Forwarded-For`, never the BFF; IPv6 clients share a bucket per /64). Login, refresh,
        request-password-reset, reset-password, confirm-email-change and tenant registration also
        carry their own tighter per-client limit. change-password is limited per PERSON (5 per
        minute, burst 5, whichever address the requests come from).
      headers:
        Retry-After:
          description: Seconds until the request may be retried.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ServiceBusy:
      description: |
        Every password-hashing slot of this process was busy for longer than the queue
        timeout (the process bounds concurrent Argon2id work, ADR 0068 D12), or the caller's
        own address already had its share of operations running and a full line of waiting
        ones. A caller's operations beyond its share WAIT their turn (within the same queue
        timeout) instead of failing, so a burst from one office address is served; only the
        wait that runs out, or the line that is full, answers this. Nothing was done and
        nothing was counted; retry after `Retry-After` seconds. Every login branch (real
        account, unknown email, locked account) answers this the same way.
      headers:
        Retry-After:
          description: Seconds until the request may be retried.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    PasswordPolicyViolation:
      description: |
        The password does not satisfy the tenant password policy (ADR 0068 D13). `error` is
        `password_policy_violation`; `errors.<field>` lists the failed rule codes, in this
        order, for the field that carried the password: `min_length`, `max_length`,
        `requires_uppercase`, `requires_lowercase`, `requires_digit`, `requires_symbol`.
        `max_length` is answered alone: a password over 1024 bytes is refused before any
        class counting or hashing. `detail` is a fixed sentence; the answer never echoes the
        password. A violation changes nothing (a reset token stays valid, the session stays
        alive). Which tenant's policy applies is stated on each operation. The policy is
        enforced when a password is SET: a weakened policy never locks an existing member out
        and a strengthened one applies at the next password set, not at login. The system
        default, used by a tenant that never stored a policy, is 8 characters minimum (so
        `min_length` is the failure for 7 characters) with all four classes.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Field-level validation failure (RFC 9457 with `errors` map)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InternalServerError:
      description: Server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    # ===== Errors ======================================================
    ErrorResponse:
      type: object
      description: |
        RFC 9457 Problem Details + LeadKart legacy fields. Legacy `error`/
        `message` stay populated for backward compat. Validation failures
        carry the `errors` map (field name → list of stable codes, never sentences; a part of a nested object is
        keyed `object.part`, e.g. `address.pincode`). The stable field
        code `invalid_characters` marks text a person typed that holds control,
        direction-override, invisible or line-breaking characters (see the operations
        that accept names, titles and reasons). A zero-width joiner or non-joiner
        between two letters or marks of one word is accepted and must not be stripped.
      properties:
        type:   { type: string, description: 'RFC 9457 §3.1.1 — canonical type URI' }
        title:  { type: string, description: 'RFC 9457 §3.1.2 — human-readable summary' }
        status: { type: integer, description: 'RFC 9457 §3.1.3 — HTTP status code' }
        detail: { type: string, description: 'RFC 9457 §3.1.4 — human-readable detail' }
        error:  { type: string, description: 'machine-parseable code (LeadKart legacy)' }
        message: { type: string, description: 'human-readable message (LeadKart legacy)' }
        reason:
          type: string
          description: |
            Refines `error` where a client must react differently to one failure of a code
            (RFC 9457 extension). Present only on `401 refresh_rejected`: `session_expired`
            (the session reached its absolute lifetime or sat idle past `Refresh.SlidingTTL`) or
            `tenant_suspended` (the person's company is suspended) or `tenant_not_active` (it is
            pending or marked for deletion). Absent everywhere else.
        errors:
          type: object
          description: 'Field-level errors (RFC 9457 §3.1 extension). Key = JSON field name; value = list of error strings.'
          additionalProperties:
            type: array
            items: { type: string }
      required: [error]

    # ===== Auth ========================================================
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password }
        device_label:
          type: string
          description: 'Optional. When empty, derived from User-Agent → RemoteAddr → "Unknown device".'

    LoginResponse:
      type: object
      required: [access_token, refresh_token, access_token_expires_at, token_type, must_change_password]
      properties:
        access_token:   { type: string }
        refresh_token:  { type: string }
        access_token_expires_at: { type: string, format: date-time, description: 'UTC expiry of access_token (issued + 600 s).' }
        token_type:     { type: string, enum: [Bearer] }
        must_change_password:
          type: boolean
          description: |
            BRD line 241 + ADR 0053 / ADR 0068 D8: when true, the credential was
            provisioned by an admin/operator. The access token carries the flag and
            every route except change-password and capabilities answers `403
            password_change_required` until the password is changed. Always present
            on login AND refresh (refresh mints it from the stored person, so a
            front-end that lost its own gate restores it from here).

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
        reason:        { type: string }

    RequestPasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }

    ResetPasswordRequest:
      type: object
      required: [token, new_password]
      properties:
        token:        { type: string }
        new_password: { type: string, format: password, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password:     { type: string, format: password, minLength: 8 }

    RequestEmailChangeRequest:
      type: object
      required: [new_email]
      properties:
        new_email: { type: string, format: email }

    ConfirmEmailChangeRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    # ===== Capabilities ================================================
    CapabilitiesDto:
      type: object
      required: [person_id, membership_id, tenant_id, tenant_slug, is_platform, is_super_user, must_change_password, permissions, effective_permissions, roles, rank, tier, password_policy]
      properties:
        person_id:     { type: string, format: uuid }
        membership_id: { type: string, format: uuid }
        tenant_id:     { type: string, format: uuid }
        tenant_slug:   { type: string }
        email:         { type: string }
        first_name:    { type: string }
        last_name:     { type: string }
        is_platform:   { type: boolean }
        is_super_user: { type: boolean }
        must_change_password:
          type: boolean
          description: Mirrors the access token's flag. True while the person holds a temporary credential; such a token reaches only change-password and this endpoint.
        permissions:
          type: array
          items: { type: string }
        effective_permissions:
          type: array
          items: { type: string }
          description: Every catalogue permission the caller satisfies in their own tenant (tenant.admin expanded). Use this, not permissions[], for UI gating.
        roles:
          type: array
          items: { $ref: '#/components/schemas/CapabilityRoleDto' }
        rank:
          type: integer
          minimum: 0
          maximum: 99
          description: |
            Seniority from the access token's `rank` claim (ADR 0069): 0 = owner, lower is more senior,
            99 = no role. Tokens minted before the claim existed read as 99. Hide actions on members whose
            rank is not strictly greater than this (owners may also act on owners).
        tier:
          type: string
          enum: [owner, admin, manager, team_lead, user]
          description: 'Band of `rank`: owner 0; admin 1-10; manager 11-20; team_lead 21-30; user 31-99.'
        password_policy:
          $ref: '#/components/schemas/PasswordRulesDto'
        impersonation:
          $ref: '#/components/schemas/ImpersonationContextDto'

    ImpersonationContextDto:
      type: object
      description: |
        Present ONLY when the bearer token is an impersonation session's own token. Names the session the
        token belongs to and the company it acts in, so a reloaded page can print "Impersonating <company>"
        without keeping the name in memory. Read fresh (a rename shows on the next read, never cached).
        It carries nothing about any other session.
      required: [session_id, tenant_display_name]
      properties:
        session_id:          { type: string, format: uuid }
        tenant_display_name: { type: string, description: "The acted-in tenant's CURRENT display name; empty only if the tenant row is gone or unreadable." }

    PasswordRulesDto:
      type: object
      description: |
        The password rules that bind the caller (the caller's own tenant's policy, or the system
        default), under the same names as the rule codes of the 422 `password_policy_violation`
        answer. A class rule applies only when its flag is true.
      required: [min_length, max_length, requires_uppercase, requires_lowercase, requires_digit, requires_symbol]
      properties:
        min_length:
          type: integer
          minimum: 8
          maximum: 128
          description: Minimum length in characters (Unicode code points).
        max_length:
          type: integer
          description: Size bound in BYTES (1024); a longer password fails the rule `max_length`. Not configurable per tenant.
        requires_uppercase: { type: boolean }
        requires_lowercase: { type: boolean }
        requires_digit:     { type: boolean }
        requires_symbol:    { type: boolean, description: 'A symbol is punctuation or a symbol character; whitespace is not one.' }

    CapabilityRoleDto:
      type: object
      required: [id, name, is_super_admin]
      properties:
        id:             { type: string, format: uuid }
        name:           { type: string }
        is_super_admin: { type: boolean }

    # ===== Sessions ====================================================
    SessionDto:
      type: object
      required: [family_id, tenant_id, device_label, created_at, last_used_at]
      properties:
        family_id:    { type: string, format: uuid }
        tenant_id:    { type: string, format: uuid }
        device_label: { type: string }
        created_at:   { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }

    ListSessionsResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionDto' }

    RevokeAllSessionsRequest:
      type: object
      properties:
        except_current: { type: boolean }
        reason:         { type: string }

    RevokeAllSessionsResponse:
      type: object
      required: [revoked_count]
      properties:
        revoked_count: { type: integer }

    # ===== Tenants =====================================================
    RegisterTenantRequest:
      type: object
      required: [slug, legal_name, display_name, admin_email, admin_password, admin_first_name, admin_last_name]
      properties:
        slug:             { type: string, pattern: '^[a-z0-9-]+$', minLength: 2, maxLength: 100 }
        legal_name:       { type: string, maxLength: 200 }
        display_name:     { type: string, maxLength: 200 }
        admin_email:      { type: string, format: email }
        admin_password:   { type: string, format: password, minLength: 8 }
        admin_first_name: { type: string }
        admin_last_name:  { type: string }

    RegisterTenantResponse:
      type: object
      required: [tenant_id, person_id, membership_id]
      properties:
        tenant_id:     { type: string, format: uuid }
        person_id:     { type: string, format: uuid }
        membership_id: { type: string, format: uuid }

    TenantDto:
      type: object
      required: [id, slug, legal_name, display_name, status, created_at, admin_address, password_policy]
      properties:
        id:           { type: string, format: uuid }
        slug:         { type: string }
        legal_name:   { type: string }
        display_name: { type: string }
        status:       { type: string, enum: [pending, active, suspended, pending_deletion, deleted] }
        created_at:   { type: string, format: date-time }
        activated_at: { type: string, format: date-time }
        suspended_at: { type: string, format: date-time }
        deletion_scheduled_at: { type: string, format: date-time }
        deletion_reason: { type: string }
        gst_number:           { type: string }
        pan_number:           { type: string }
        drug_licence_number:  { type: string }
        admin_phone:          { type: string }
        admin_address: { $ref: '#/components/schemas/AdminAddressDto' }
        password_policy: { $ref: '#/components/schemas/PasswordPolicyDto' }
        locale:      { type: string }
        time_zone:   { type: string }
        date_format: { type: string }
        currency:    { type: string }

    AdminAddressDto:
      type: object
      properties:
        street:    { type: string }
        city:      { type: string }
        district:  { type: string }
        state:     { type: string }
        state_code: { type: string }
        pincode:   { type: string }

    PasswordPolicyDto:
      type: object
      description: |
        A tenant's password policy. A company that has never saved one reports the system
        default (8 characters minimum, all four classes required, 5 failed attempts, 15
        lockout minutes), so every read of a company returns a policy inside the bounds
        below and a client may send it straight back. A tenant admin may set any rule inside the
        validated bounds below, INCLUDING rules weaker than the platform default
        (all four classes): `min_length` may go down to 8 (the default's own length) and any subset of
        the four classes, none included, may be required. The platform guarantees only the
        floors, not the default. `max_failed_attempts` and `lockout_minutes` are accepted,
        stored and returned but NOT ENFORCED: the platform lockout is fixed (10 failures in
        15 minutes locks for 15 minutes, for every account, so that a locked answer reveals
        nothing about which emails exist). Clients should not show them.
      required: [min_length, require_uppercase, require_lowercase, require_digit, require_symbol, max_failed_attempts, lockout_minutes]
      properties:
        min_length:
          type: integer
          minimum: 8
          maximum: 128
          description: Minimum password length in characters (8 to 128; counted in characters, not bytes).
        require_uppercase:    { type: boolean }
        require_lowercase:    { type: boolean }
        require_digit:        { type: boolean }
        require_symbol:       { type: boolean }
        max_failed_attempts:
          type: integer
          minimum: 3
          maximum: 50
          deprecated: true
          description: Stored, not enforced - the platform lockout is fixed. Validated to 3..50. Hide it in the UI.
        lockout_minutes:
          type: integer
          minimum: 0
          maximum: 1440
          deprecated: true
          description: Stored, not enforced - the platform lockout is fixed. Validated to 0..1440. Hide it in the UI.

    UpdateTenantProfileRequest:
      type: object
      description: Full replace. Every field is required; a body that omits one is 400 `invalid_body` (the `errors` map names it) and nothing is changed.
      required: [legal_name, display_name]
      properties:
        legal_name:   { type: string, maxLength: 200 }
        display_name: { type: string, maxLength: 200 }

    UpdateTenantStatutoryRequest:
      type: object
      description: Full replace. Every field is required (an empty string clears that declaration); a body that omits one is 400 `invalid_body` and nothing is changed.
      required: [gst_number, pan_number, drug_licence_number]
      properties:
        gst_number:           { type: string }
        pan_number:           { type: string }
        drug_licence_number:  { type: string }

    UpdateTenantAdminContactRequest:
      type: object
      description: Full replace. `phone` and `address` (with every address field) are required; a body that omits one is 400 `invalid_body` (the `errors` map names it, e.g. `address.pincode`) and nothing is changed.
      required: [phone, address]
      properties:
        phone:   { type: string }
        address: { $ref: '#/components/schemas/AdminAddressInput' }

    AdminAddressInput:
      type: object
      description: The admin address as written by PATCH admin-contact. Every field is required (an empty string clears it).
      required: [street, city, district, state, state_code, pincode]
      properties:
        street:    { type: string }
        city:      { type: string }
        district:  { type: string }
        state:     { type: string }
        state_code: { type: string }
        pincode:   { type: string }

    UpdateTenantSettingsRequest:
      type: object
      description: Full replace. `password_policy` and each of its fields are required; a body that omits one is 400 `invalid_body` and nothing is changed.
      required: [password_policy]
      properties:
        password_policy: { $ref: '#/components/schemas/PasswordPolicyDto' }

    UpdateTenantDisplayPreferencesRequest:
      type: object
      description: Full replace. Every field is required; a body that omits one is 400 `invalid_body` and nothing is changed.
      required: [locale, time_zone, date_format, currency]
      properties:
        locale:      { type: string }
        time_zone:   { type: string }
        date_format: { type: string }
        currency:    { type: string }

    SuspendTenantRequest:
