  /api/v1/users/{userId}/permission-overrides:
    patch:
      tags: [users]
      summary: Replace user's granted + revoked permission overlays atomically
      description: |
        Both arrays are required; empty arrays clear the corresponding overlay. This REPLACES the whole set: read the current one first from `GET /users/{userId}` (`permission_overrides`) and re-send what must stay. A name that is already a live grant and is re-sent keeps its existing expiry (a time-bound grant from an approved permission request stays time-bound and cannot be extended by re-sending it); every other granted name is permanent. Permission names
        MUST match the closed `permission.IdentityPermissions` catalogue;
        unknown names surface as 422 (`permission_unknown`). A name listed twice in one array is stored once; a name present in BOTH arrays is a 422 `validation_failed` with `errors{revoked: ["also_granted"]}` (compare your own two arrays to find the names).
        Requires `identity.users.update_permissions` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068). Self-target forbidden (`self_modification_forbidden`). The caller must strictly outrank the target member (`insufficient_rank`; owners may act on owners; super users and exempt platform operators are exempt), decided inside the transaction that holds the tenant's authority lock (ADR 0069). Conferring a permission the caller does not hold is rejected with `grant_exceeds_authority`.
      x-required-permissions: [identity.users.update_permissions]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/UserId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceUserPermissionOverridesRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Overrides replaced }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`owner_protected` — tenant.admin cannot be revoked from an owner; `member_roles_inconsistent` — the member's assigned roles cannot be loaded as this tenant's roles, so its rank cannot be decided; nothing was changed (an assignment row written outside the commands, e.g. an operator repair or a restored backup, pointing at a role of another tenant)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }

