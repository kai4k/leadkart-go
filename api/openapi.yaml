      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Manager removed }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`member_roles_inconsistent` — the member's assigned roles cannot be loaded as this tenant's roles, so its rank cannot be decided; nothing was changed (an assignment row written outside the commands, e.g. an operator repair or a restored backup, pointing at a role of another tenant)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
