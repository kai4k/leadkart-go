        '204': { description: Profile updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { description: "Conflict with the current state of the resource (see the `error` code)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/tenants/{tenantId}/statutory:
    patch:
      tags: [tenants]
      summary: Update tenant statutory IDs (GST / PAN / drug licence)
      description: |
        Empty strings clear the corresponding declaration; the aggregate
        accepts a zero Statutory VO for tenants that haven't yet
        onboarded their compliance IDs.
        A malformed GST, PAN or drug-licence number is 422 `validation_failed` with an
        `errors` entry under `gst_number` (`["invalid_gstin"]`), `pan_number` (`["invalid_pan"]`) or
        `drug_licence_number` (`["invalid_drug_licence"]`). Each value is a stable code, never a sentence.
        Requires `identity.tenants.update` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
      x-required-permissions: [identity.tenants.update]
