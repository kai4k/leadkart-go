      description: |
        A company that has not set a policy reports the default policy on every read, so the body a client read back is always accepted (full replace).

        Requires `identity.tenants.update_settings` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
