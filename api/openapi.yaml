        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/persons/{personId}/profile:
    patch:
      tags: [platform]
      summary: Update the GLOBAL Person profile (first + last name)
      description: |
        Updates Person.FirstName / Person.LastName — distinct from the
        per-Tenant designation/department/status_message which move via
        PATCH /api/v1/users/{userId}/profile.

        Requires `platform.users.manage` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
        An operator cannot change their own Person: the caller's own `personId` is refused with 403 `self_modification_forbidden` (super users exempt).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `person_invalid` with `errors{<field>: ["invalid_characters"]}` for `first_name`, `last_name`, and nothing is written. A full-replace body that re-sends a stored value UNCHANGED is accepted (a value stored before the rule existed never blocks an untouched save); only a changed value is checked.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PersonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePersonProfileRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Profile updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '409': { description: "Conflict with the current state of the resource (see the `error` code)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/platform/persons/{personId}/global-suspend:
    post:
      tags: [platform]
      summary: Globally suspend a Person across all tenants
      description: |
        Reason is mandatory per data-retention.md audit canon.

        Requires `platform.users.manage` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
        An operator cannot change their own Person: the caller's own `personId` is refused with 403 `self_modification_forbidden` (super users exempt).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `person_invalid` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PersonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GlobalSuspendPersonRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Person globally suspended }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`last_owner_protected` — the person is the only active owner of a tenant; nothing was changed. `person_memberships_changing` — the person's memberships kept changing while the change was checked (a reactivation raced it); nothing was changed, retry", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/persons/{personId}/lift-global-suspension:
    post:
      tags: [platform]
      summary: Lift a previously applied global suspension
      description: |
        Requires `platform.users.manage` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
        An operator cannot change their own Person: the caller's own `personId` is refused with 403 `self_modification_forbidden` (super users exempt).
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PersonId' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Suspension lifted }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: "Conflict with the current state of the resource (see the `error` code)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/platform/persons/{personId}/anonymise:
    post:
      tags: [platform]
      summary: Anonymise a Person record directly (DPDP §12 / GDPR Art. 17)
      description: |
        Requires `identity.users.anonymise` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
        An operator cannot change their own Person: the caller's own `personId` is refused with 403 `self_modification_forbidden` (super users exempt).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `person_invalid` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/PersonId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnonymiseRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Person anonymised }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "`last_owner_protected` — the person is the only active owner of a tenant; nothing was changed. `person_memberships_changing` — the person's memberships kept changing while the change was checked (a reactivation raced it); nothing was changed, retry", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/platform/persons:
    get:
      tags: [platform]
      summary: Get person by email (cross-tenant operator probe)
      description: |
        Requires `platform.users.view` held by a platform-tenant operator; platform-tenant membership alone is refused with 403 `forbidden`.
      parameters:
        - name: email
          in: query
