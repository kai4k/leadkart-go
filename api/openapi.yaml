  # ===== USERS ==========================================================
  /api/v1/users:
    get:
      tags: [users]
      summary: List active members of the caller's tenant (cursor-paginated)
      description: |
        Requires `identity.users.view` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).
      x-required-permissions: [identity.users.view]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Users page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListUsersResponse' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '400': { $ref: '#/components/responses/BadRequest' }
    post:
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - $ref: '#/components/parameters/XTenantId'
      tags: [users]
      summary: Create a user (find-or-create-by-email, per Auth0/Entra ID canon)
      description: |
        Requires `identity.users.create` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).

        **Who may add users (owner ruling 2026-11-21):** a super user, a platform operator holding
        `platform.users.create` or `platform.users.manage` (through `X-Tenant-Id` or an impersonation
        session), and, inside a company, ONLY the Company Owner and the Administrator tier (rank 0 to 10).
        Everyone below that tier is refused, even a member who still holds `identity.users.create` from
        before the ruling: the route answers `403 forbidden` (the permission is not in the caller's
        `effective_permissions`), and the command, deciding on the caller's stored roles under the tenant
        lock, answers `403 admin_tier_required` for a stale token. A refused caller learns nothing about the
        email (no `email_has_active_membership`).

        The temporary password is checked against the password policy of the TARGET tenant
        (the effective tenant: the caller's own, or the one an operator acts in through
        `X-Tenant-Id`): `422 password_policy_violation` with `errors.password`. Nothing is
        created on a violation.

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `user_invalid` with `errors{<field>: ["invalid_characters"]}` for `first_name`, `last_name`, and nothing is written.
      x-required-permissions: [identity.users.create]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceBusy' }
        '201':
          description: User created (or attached to existing global Person)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateUserResponse' }
        '403':
          description: "`forbidden` (the caller lacks `identity.users.create`, including every member below the Administrator tier), `admin_tier_required` (the caller's stored rank is below the Administrator tier), or `tenant_scope_forbidden` (see TenantScopeForbidden)"
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } }
        '400': { description: "`invalid_body` — the body is not valid JSON; `invalid_email` — the email is not a valid address", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '409': { description: "`email_has_active_membership` — the email already has an active membership in another tenant", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '422': { description: "`password_policy_violation` — the password fails the target tenant's policy (field `errors.password`, see PasswordPolicyViolation); `user_invalid` — the new membership violates a domain invariant (see `message`)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/users/search:
    get:
      tags: [users]
      summary: Member picker (search active members by name)
      description: |
        The picker behind lead reassignment. Requires `crm.leads.assign` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068), and searches the caller's effective tenant only.

        Returns ACTIVE members whose display name (first name, a space, last name) contains `q`, case-insensitively, best first (by name), at most `limit`. A hit carries `membership_id`, `display_name` and `designation` only: no email, no phone, no person id. A deactivated, anonymised or globally suspended person is never offered. `q` is trimmed and measured in characters: under 2 is 400 `search_query_too_short`, over 100 is 400 `search_query_too_long`. An empty match is 200 with `members: []`, which a client shows as "no match" and keeps apart from a failed call.
      x-required-permissions: [crm.leads.assign]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: Matching members
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchMembersResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }

  /api/v1/users/{userId}:
    get:
      tags: [users]
      summary: Get one user (membership) by ID
      description: |
        Requires `identity.users.view` or self (path id equals the caller's membership) (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).

        `permission_overrides` (live grants with their expiry, and revoked names) is returned ONLY to a caller who holds `identity.users.update_permissions` AND may act on this member (strictly outranks them; owners on owners; super users and exempt platform operators); for every other caller the field is absent (never an error). It is what `PATCH .../permission-overrides` replaces, so a form seeds from it and re-sends what it does not mean to remove.
      x-required-permissions: [identity.users.view, self]
      parameters:
        - { $ref: '#/components/parameters/UserId' }
        - $ref: '#/components/parameters/XTenantId'
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserDto' }
        '403': { $ref: '#/components/responses/TenantScopeForbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /api/v1/users/{userId}/profile:
    patch:
      tags: [users]
      summary: Update user designation + department + status message
      description: |
        Requires `identity.users.update` or self (path id equals the caller's membership) (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068).  Editing ANOTHER member's profile is also an authority decision: the caller must strictly outrank the member (`insufficient_rank`; owners may act on owners; super users and exempt platform operators are exempt), decided under the tenant's authority lock (ADR 0069); editing one's own profile is unchanged.

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `user_invalid` with `errors{<field>: ["invalid_characters"]}` for `designation`, `department`, `status_message`, and nothing is written. A full-replace body that re-sends a stored value UNCHANGED is accepted (a value stored before the rule existed never blocks an untouched save); only a changed value is checked.
      x-required-permissions: [identity.users.update, self]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
        - { $ref: '#/components/parameters/UserId' }
        - $ref: '#/components/parameters/XTenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserProfileRequest' }
      responses:
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '204': { description: Profile updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/AuthorityForbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Conflict with the current state of the resource (see the `error` code)", content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }

  /api/v1/users/{userId}/deactivate:
    post:
      tags: [users]
      summary: Deactivate a user (reason required)
      description: |
        Requires `identity.users.deactivate` (satisfied by `tenant.admin` in the caller's own tenant, or by `platform.*` equivalents for platform operators; ADR 0068). Self-target forbidden (`self_modification_forbidden`). The caller must strictly outrank the target member (`insufficient_rank`; owners may act on owners; super users and exempt platform operators are exempt), decided inside the transaction that holds the tenant's authority lock (ADR 0069).

        Text a person types that other people read is refused when it holds control characters (including CR, LF and TAB), Unicode direction overrides, or invisible or line-breaking characters (zero-width space, soft hyphen, word joiner and invisible operators, Hangul fillers, line and paragraph separators, annotation, object-replacement and tag characters, BOM; a zero-width joiner or non-joiner is accepted only INSIDE a word, between two letters or marks): 422 `user_invalid` with `errors{<field>: ["invalid_characters"]}` for `reason`, and nothing is written.
      x-required-permissions: [identity.users.deactivate]
      parameters:
        - $ref: '#/components/parameters/XCommandId'
