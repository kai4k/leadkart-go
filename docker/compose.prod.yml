# ============================================================================
# LeadKart Go — Production Docker Compose (VPS deployment)
# ============================================================================
# Mirrors .NET LeadKart docker-compose.prod.yml shape (postgres tuning,
# loopback-only ports, health-gated depends_on, resource limits, migrate
# one-shot before api comes up).
#
# First-time setup on VPS:
#   1. Create /etc/leadkart/.env (see docs/deploy/.env.example)
#   2. Copy this file + Caddyfile to /opt/leadkart/
#   3. docker compose -f compose.prod.yml --env-file /etc/leadkart/.env up -d
#
# Startup order (orchestrated by depends_on + healthcheck conditions):
#   postgres → redis → migrate (applies migrations as owner, exits)
#                  └─→ api (connects as leadkart_app under FORCE RLS)
#                  └─→ worker (outbox forwarder + subscribers + River jobs; NOT optional)
#                  └─→ caddy (when Web BFF lands; reverse-proxy + auto-SSL)
#
# CI is NOT re-run here — branch protection on main + green CI gate the
# release tag that produced these images. By the time this file pulls,
# the artifacts are signed (cosign) + SBOM-attested + Trivy-scanned via
# release.yml.
#
# Required .env keys:
#   POSTGRES_OWNER, POSTGRES_OWNER_PASSWORD   — schema-owning role (migrations)
#   POSTGRES_APP_PASSWORD                     — leadkart_app runtime role
#   REDIS_PASSWORD                            — redis-cli AUTH
#   JWT_KEY_ID, JWT_SIGNING_KEY               — JWT issuance (>=32 bytes)
#   LEADKART_IDENTITY__LOCKOUT_KEY            — phantom-lockout HMAC key (openssl rand -base64 32)
#   LEADKART_HTTP__TRUSTED_PROXIES            — the BFF's address / dedicated subnet, or "none"
#   API_IMAGE                                 — ghcr.io/<org>/leadkart-go-api:<tag>
#   WORKER_IMAGE                              — ghcr.io/<org>/leadkart-go-worker:<tag>
#   MIGRATE_IMAGE                             — ghcr.io/<org>/leadkart-go-migrate:<tag>
#
# All three images are built, signed and published by .github/workflows/release.yml
# (TestArch_ProdComposeImagesAreReleased fails when this file pulls an image the
# release does not build).
# Deployment checklist (one page, with the alerts to set): docs/deploy/production-checklist.md
# ============================================================================

services:

  # ---- PostgreSQL 17 --------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: leadkart-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"   # loopback only — never expose to public iface
    environment:
      POSTGRES_DB: leadkart
      POSTGRES_USER: ${POSTGRES_OWNER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # init.sql provisions leadkart_app + leadkart_test roles per the
      # 3-roles doctrine in multi-tenancy.md. Mounted into the standard
      # /docker-entrypoint-initdb.d/ — runs on first boot only.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER} -d leadkart"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    # Tuning per Brandur Leach's Crunchy Bridge production doc + LeadKart
    # .NET prod compose. pg_stat_statements is mandatory observability per
    # audit-checklist.md §12 — without it, slow-query forensics are blind.
    command: >
      postgres
        -c shared_preload_libraries=pg_stat_statements
        -c pg_stat_statements.track=all
        -c max_connections=100
        -c shared_buffers=256MB
        -c effective_cache_size=1GB
        -c work_mem=4MB
        -c maintenance_work_mem=64MB
        -c random_page_cost=1.1
        -c log_min_duration_statement=500
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  # ---- Redis 7 --------------------------------------------------------------
  # AUTH-protected + AOF persistence + LRU eviction at 128MB. allkeys-lru is
  # the canonical SaaS-cache eviction policy when you also use Redis as a
  # session/blacklist store (Microsoft Learn HybridCache + StackExchange.Redis
  # docs converge on this).
  redis:
    image: redis:7-alpine
    container_name: leadkart-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: >
      redis-server
        --appendonly yes
        --maxmemory 128mb
        --maxmemory-policy allkeys-lru
        --requirepass ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ---- Migrate (one-shot) ---------------------------------------------------
  # Connects as the OWNER role — required to CREATE TABLE / INDEX. Runtime
  # api uses leadkart_app (non-owner, FORCE RLS active). One-shot per
  # database.md "Single schema writer" doctrine.
  migrate:
    image: ${MIGRATE_IMAGE:-ghcr.io/leadkart/leadkart-go-migrate:latest}
    container_name: leadkart-migrate
    restart: "no"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_OWNER}:${POSTGRES_OWNER_PASSWORD}@postgres:5432/leadkart?sslmode=disable"
      MIGRATIONS_DIR: "/migrations"
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ---- API (HTTP only: the outbox forwarder, subscribers and jobs run in the worker below) ----
  api:
    image: ${API_IMAGE:-ghcr.io/leadkart/leadkart-go-api:latest}
    container_name: leadkart-api
    restart: unless-stopped
    ports:
      # Loopback only — Caddy fronts public traffic. Direct exposure would
      # bypass HTTPS termination + WAF + rate-limiting at the edge.
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
    environment:
      # leadkart_app role — non-owner, FORCE RLS fires on every query.
      LEADKART_POSTGRES__DSN: "postgres://leadkart_app:${POSTGRES_APP_PASSWORD}@postgres:5432/leadkart?sslmode=disable"
      LEADKART_REDIS__ADDR: "redis:6379"
      LEADKART_REDIS__PASSWORD: "${REDIS_PASSWORD}"
      LEADKART_LISTEN__API: ":8080"
      LEADKART_LISTEN__ADMIN: ":9090"
      LEADKART_JWT__KEY_ID: "${JWT_KEY_ID}"
      LEADKART_JWT__SIGNING_KEY: "${JWT_SIGNING_KEY}"
      LEADKART_REFRESH__ABSOLUTE_TTL: "336h"
      # Idle timeout (Refresh.SlidingTTL): a session not refreshed for this long ends
      # (owner ruling 2026-11-21: 24 hours).
      LEADKART_REFRESH__SLIDING_TTL: "${LEADKART_REFRESH__SLIDING_TTL:-24h}"
      # Bounds on concurrent Argon2id work (docker/.env.example "Argon2 concurrency").
      LEADKART_ARGON2__MAX_CONCURRENT: "${LEADKART_ARGON2__MAX_CONCURRENT:-16}"
      LEADKART_ARGON2__QUEUE_TIMEOUT: "${LEADKART_ARGON2__QUEUE_TIMEOUT:-2s}"
      # Password work is fair per client and part of the gate is kept for signed-in
      # users (docker/.env.example "Argon2 concurrency").
      LEADKART_ARGON2__MAX_PER_CLIENT: "${LEADKART_ARGON2__MAX_PER_CLIENT:-2}"
      LEADKART_ARGON2__RESERVED_AUTHENTICATED: "${LEADKART_ARGON2__RESERVED_AUTHENTICATED:-4}"
      # Per-route rate limits (docker/.env.example "Client IP and rate limits"); defaults are the code defaults.
      LEADKART_RATE_LIMIT__CHANGE_PASSWORD__BURST: "${LEADKART_RATE_LIMIT__CHANGE_PASSWORD__BURST:-5}"
      LEADKART_RATE_LIMIT__CHANGE_PASSWORD__PER_MINUTE: "${LEADKART_RATE_LIMIT__CHANGE_PASSWORD__PER_MINUTE:-5}"
      LEADKART_RATE_LIMIT__EMAIL_CHANGE_CONFIRM__BURST: "${LEADKART_RATE_LIMIT__EMAIL_CHANGE_CONFIRM__BURST:-5}"
      LEADKART_RATE_LIMIT__EMAIL_CHANGE_CONFIRM__PER_MINUTE: "${LEADKART_RATE_LIMIT__EMAIL_CHANGE_CONFIRM__PER_MINUTE:-10}"
      LEADKART_RATE_LIMIT__LOGIN__BURST: "${LEADKART_RATE_LIMIT__LOGIN__BURST:-10}"
      LEADKART_RATE_LIMIT__LOGIN__PER_MINUTE: "${LEADKART_RATE_LIMIT__LOGIN__PER_MINUTE:-30}"
      LEADKART_RATE_LIMIT__PASSWORD_RESET_REQUEST__BURST: "${LEADKART_RATE_LIMIT__PASSWORD_RESET_REQUEST__BURST:-5}"
      LEADKART_RATE_LIMIT__PASSWORD_RESET_REQUEST__PER_MINUTE: "${LEADKART_RATE_LIMIT__PASSWORD_RESET_REQUEST__PER_MINUTE:-5}"
      LEADKART_RATE_LIMIT__PASSWORD_RESET__BURST: "${LEADKART_RATE_LIMIT__PASSWORD_RESET__BURST:-5}"
      LEADKART_RATE_LIMIT__PASSWORD_RESET__PER_MINUTE: "${LEADKART_RATE_LIMIT__PASSWORD_RESET__PER_MINUTE:-10}"
      LEADKART_RATE_LIMIT__REFRESH__BURST: "${LEADKART_RATE_LIMIT__REFRESH__BURST:-30}"
      LEADKART_RATE_LIMIT__REFRESH__PER_MINUTE: "${LEADKART_RATE_LIMIT__REFRESH__PER_MINUTE:-120}"
      LEADKART_RATE_LIMIT__TENANT_REGISTRATION__BURST: "${LEADKART_RATE_LIMIT__TENANT_REGISTRATION__BURST:-5}"
      LEADKART_RATE_LIMIT__TENANT_REGISTRATION__PER_MINUTE: "${LEADKART_RATE_LIMIT__TENANT_REGISTRATION__PER_MINUTE:-10}"
      # Go heap ceiling: 16 Argon2 slots x ~19.5 MiB = ~312 MiB of LIVE memory, and the
      # collector needs headroom on top of it (garbage of past hashes, the pool, the
      # caches), so the live figure is not the container figure. GOMEMLIMIT makes the
      # runtime collect harder as the heap nears the limit instead of growing until the
      # kernel kills the container: ~900 MiB for the 1 GiB limit below, leaving ~100 MiB
      # for stacks, cgo-free runtime structures and the non-heap rest. Raise
      # MAX_CONCURRENT only together with the container limit AND this value.
      GOMEMLIMIT: "${GOMEMLIMIT:-900MiB}"
      # REQUIRED in production (config.Validate): the key of the phantom failed-login
      # counter, dedicated so a JWT signing-key rotation cannot reset it. base64 of >= 32
      # random bytes: openssl rand -base64 32. Rotating it restarts the phantom counters
      # (a short 423-vs-401 window), so rotate deliberately, never routinely.
      LEADKART_IDENTITY__LOCKOUT_KEY: "${LEADKART_IDENTITY__LOCKOUT_KEY:?set to openssl rand -base64 32 (a dedicated secret, not the JWT key)}"
      # Production mode: the api refuses to start when its database role is an owner /
      # superuser or lacks a privilege (pg.VerifyApplicationPrivileges), and when
      # LEADKART_HTTP__TRUSTED_PROXIES is unset or too wide (config.Validate).
      LEADKART_ENV: "production"
      # REQUIRED: the address or CIDR of the BFF / ingress in front of the api
      # (private, loopback, link-local, CGNAT or ULA; nothing wider than /8 IPv4 or
      # /32 IPv6), or the word "none" when the api is directly exposed. Unset = the
      # container does not start: an unset list puts every user in one rate-limit
      # bucket per credential route.
      LEADKART_HTTP__TRUSTED_PROXIES: "${LEADKART_HTTP__TRUSTED_PROXIES:?set to the BFF's fixed address or a dedicated subnet (NOT 172.16.0.0/12: that trusts every Docker network on the host), or none if the api is directly exposed}"
      TZ: "UTC"
    healthcheck:
      test: ["CMD", "/api", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"

  # ---- Worker (outbox forwarder + subscribers + River jobs) ---------------
  # PART OF PRODUCTION. Without it: no outbox row is ever delivered, so the
  # subscribers never run (security-stamp cache eviction, the refresh-family
  # revocation backstop, suspension / deactivation cascades, audit,
  # email), the phantom failed-login table is never purged and River jobs never run.
  # The api shows a dead worker: the gauge leadkart.outbox.oldest_unacked_age_seconds
  # and a WARN at boot (docs/deploy/production-checklist.md lists the alerts).
  # The worker validates only what it uses (config.ValidateWorker): it needs no
  # trusted-proxy list, no lockout key and no Argon2 settings.
  worker:
    image: ${WORKER_IMAGE:-ghcr.io/leadkart/leadkart-go-worker:latest}
    container_name: leadkart-worker
    restart: unless-stopped
    environment:
      LEADKART_POSTGRES__DSN: "postgres://leadkart_app:${POSTGRES_APP_PASSWORD}@postgres:5432/leadkart?sslmode=disable"
      LEADKART_REDIS__ADDR: "redis:6379"
      LEADKART_REDIS__PASSWORD: "${REDIS_PASSWORD}"
      LEADKART_LISTEN__WORKER_ADMIN: ":9091"
      LEADKART_JWT__KEY_ID: "${JWT_KEY_ID}"
      LEADKART_JWT__SIGNING_KEY: "${JWT_SIGNING_KEY}"
      LEADKART_REFRESH__ABSOLUTE_TTL: "336h"
      LEADKART_ENV: "production"
      TZ: "UTC"
    healthcheck:
      # The binary is its own probe (distroless, no shell): GET /alive on the worker
      # admin listener, the same pattern as the api.
      test: ["CMD", "/worker", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ---- Web (Svelte SPA) — image pulled from a SEPARATE repo per ADR 0025 ---
  # Per the master plan: frontend lives in its OWN git repo (e.g.
  # leadkart-web), publishes to GHCR independently, gets composed into the
  # production stack here via WEB_IMAGE. Go API stays a pure JSON backend
  # — no co-located frontend code, no Blazor-style server-render coupling,
  # no CSRF (bearer-token JWT only). Independent FE/BE deploy cycles.
  #
  # Uncomment once the leadkart-web repo cuts its first GHCR-published
  # image; until then operators can deploy api-only and run the SPA via
  # Vercel / Cloudflare Pages / Netlify pointing at this Caddy frontend.
  #
  # web:
  #   image: ${WEB_IMAGE:-ghcr.io/leadkart/leadkart-web:latest}
  #   container_name: leadkart-web
  #   restart: unless-stopped
  #   ports:
  #     - "127.0.0.1:8081:8080"
  #   depends_on:
  #     api:
  #       condition: service_healthy

  # ---- Caddy (reverse proxy + auto-SSL) — placeholder until Web ships ------
  # The .NET prod compose has Caddy fronting api + web. Go-side waits for
  # the SEPARATE leadkart-web repo to cut its first image (per ADR 0025);
  # until then `127.0.0.1:8080` is fronted by whatever the host VPS
  # already runs (typically nginx during initial provisioning, Caddy after).

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
