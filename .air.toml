# Air hot-reload config (https://github.com/air-verse/air)
# Run: `air` (or `task run`)

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/api ./cmd/api"
  bin = "tmp/api"
  full_bin = "LEADKART_API_ADDR=:8080 ./tmp/api"
  include_ext = ["go", "sql", "yaml", "yml", "toml"]
  exclude_dir = ["tmp", "bin", "dist", "docs", "node_modules", ".git", ".github"]
  exclude_regex = ["_test\\.go", "\\.sql\\.go$", "_gen\\.go$"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = 2_000_000_000  # 2s in ns

[log]
  time = true

[color]
  build = "yellow"
  app = "white"
  watcher = "cyan"
  runner = "green"

[misc]
  clean_on_exit = true
